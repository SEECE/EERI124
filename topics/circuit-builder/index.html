<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build a circuit — EERI 124</title>
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/circuit-page.css" />
  <link rel="stylesheet" href="../../css/builder.css" />
</head>

<body>
  <nav class="nav">
    <a class="nav-brand" href="../../index.html">EERI 124 <span>· Electrotechnique 1</span></a>
    <div class="nav-links">
      <a href="../../index.html">Topics</a>
    </div>
  </nav>

  <main class="page circuit-page">
    <header class="circuit-topbar">
      <nav class="breadcrumb"><a href="../../index.html">Topics</a> / Build a circuit</nav>
      <h1>Build a circuit</h1>
    </header>

    <div class="circuit-layout">
      <aside class="circuit-sidebar">
        <div class="control-group">
          <h3>Complexity</h3>
          <select id="level"></select>
        </div>
        <div class="control-group">
          <h3>Element</h3>
          <div class="palette" id="palette"></div>
          <div class="value-row" id="value-row">
            <input type="number" id="value-input" step="any" />
            <span id="value-unit"></span>
          </div>
          <div class="control-row" id="control-row">
            <span>reads</span>
            <select id="control-select"></select>
          </div>
        </div>
        <div class="control-group">
          <p class="builder-hint">Click a grid dot, then an adjacent dot to add the selected
            element between them. Click an existing element to remove it.</p>
        </div>
        <div class="control-group">
          <button id="clear">Clear</button>
        </div>
        <div class="control-group">
          <h3>Import / Export</h3>
          <button id="export-circuit">Export JSON</button>
          <label class="file-label">Import JSON
            <input type="file" id="import-circuit" accept="application/json" hidden />
          </label>
          <div class="import-error" id="builder-error"></div>
        </div>
      </aside>

      <div class="circuit-canvas"><svg id="canvas"></svg></div>
    </div>
  </main>

  <footer>EERI 124 — Electrotechnique 1</footer>

  <script src="../../js/circuit.js"></script>
  <script src="../../js/builder.js"></script>
  <script>
    CircuitBuilder({
      canvas: 'canvas',
      level: 'level',
      palette: 'palette',
      valueRow: 'value-row',
      valueInput: 'value-input',
      unit: 'value-unit',
      controlRow: 'control-row',
      controlSelect: 'control-select',
      error: 'builder-error',
      clear: 'clear',
      exportBtn: 'export-circuit',
      importInput: 'import-circuit',
    });
  </script>
</body>

</html>
