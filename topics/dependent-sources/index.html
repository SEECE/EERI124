  <script src="../../js/ui/shell.js"></script>
  <script>
    // This topic adds the four controlled sources; KCL and KVL only, as on the current-sources
    // page (equivalent resistance needs a source to deactivate, and deactivating a controlled
    // one is a Thévenin-era idea). Two circuit sets, the same shape the §4 current-sources page
    // uses: this topic's own circuits, and every other topology run through dependify() so §3's
    // and §4's shapes get drilled with controlled sources too.
    SolverPage({
      elements: ['R', 'V', 'I', 'W', 'E', 'F', 'G', 'H'],
      sets: [
        { value: 'dependent', label: 'Dependent-source circuits', filter: { tags: ['dependent-source'] } },
        {
          value: 'all', label: 'All topologies', filter: { elements: ['R', 'V', 'I', 'W'] },
          // Wheatstone bridge opts out — its arms are the exact teaching point, flagged by its
          // B/D node labels (see circuit.js's currentify() comment). dependify() hands the
          // circuit back untouched when it cannot place one safely, so the page never breaks.
          transform: function (c) {
            var protectedWiring = c.nodes.some(function (n) { return n.label; });
            return protectedWiring ? c : Circuit.dependify(c);
          },
        },
      ],
    });
  </script>
