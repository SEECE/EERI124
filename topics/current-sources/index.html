<body class="app">
  <a class="skip-link" href="#canvas">Skip to the circuit</a>

  <header class="ribbon">
    <a class="ribbon-brand" href="../../index.html">
      <span class="ribbon-mark" aria-hidden="true"></span>
      <span class="ribbon-name" translate="no">EERI&nbsp;124</span>
    </a>
    <span class="ribbon-sep" aria-hidden="true"></span>
    <h1 class="ribbon-title">Circuits with Current Sources</h1>
    <nav class="ribbon-nav" aria-label="Topics">
      <a href="../../index.html">Home</a>
      <a href="../simple-resistive-circuits/index.html">Resistive</a>
      <a href="../current-sources/index.html" aria-current="page">Current Sources</a>

      <a href="../circuit-builder/index.html">Builder</a>

    <div class="ribbon-tools">
      <button type="button" class="icon-btn icon-btn--rail" data-panel="rail" aria-pressed="true"

      <button type="button" class="icon-btn icon-btn--workbench" data-panel="workbench" aria-pressed="true"

    </div>
  </header>

  <div class="workspace" data-rail="open" data-workbench="open">
    <aside class="rail panel scroller" id="rail" aria-label="Circuit controls">
      <div class="field">
        <label class="field-label" for="technique">Technique</label>
        <select class="ctl" id="technique">
          <option value="kcl">KCL — node-voltage</option>
          <option value="kvl">KVL — mesh-current</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="circuit-set">Circuit Set</label>
        <select class="ctl" id="circuit-set"></select>
      </div>

      <div class="field">
        <label class="field-label" for="topology">Topology</label>
        <select class="ctl" id="topology"></select>
      </div>

      <button type="button" class="btn btn--primary btn--block" id="generate">Generate Circuit</button>

      <div class="field filemenu rail-spacer">
        <span class="field-label">File</span>
        <button type="button" class="btn btn--soft btn--block" data-file-toggle aria-expanded="false"
          aria-controls="file-actions"><span class="file-caret" aria-hidden="true"></span> Open or Save</button>
        <div class="file-actions" id="file-actions" data-file-actions hidden>
          <label class="file-action" for="file-open">Open Circuit…
            <small>a .eeri file saved anywhere on this site</small>
            <input type="file" id="file-open" accept=".eeri,.json,application/json" class="sr-only" />
          </label>
          <button type="button" class="file-action" data-save="native">Save Circuit
            <small>.eeri — reopens on any page here</small></button>
          <button type="button" class="file-action" data-save="asc">Save LTspice Schematic
            <small>.asc — open and simulate it in LTspice</small></button>
          <button type="button" class="file-action" data-save="cir">Save LTspice Netlist
            <small>.cir — simulates any circuit, dependent sources included</small></button>
        </div>
        <p class="field-note" data-file-note role="status"></p>
      </div>
    </aside>

    <section class="stage panel" aria-label="Circuit diagram">
      <svg id="canvas" role="img" aria-label="The circuit being analysed"></svg>
    </section>

    <aside class="workbench panel" id="workbench" aria-label="Method workbench">
      <header class="wb-head">
        <div class="wb-head-top">
          <span class="eyebrow">Workbench</span>
          <span class="step-count" id="step-count"></span>
        </div>
        <h2 class="step-title" id="step-title" aria-live="polite"></h2>
      </header>

      <div class="wb-scroll scroller">
        <div class="step-body" id="step-body"></div>
        <div class="step-eq" id="step-eq"></div>
      </div>

      <div class="step-board scroller" id="step-board"></div>

      <footer class="wb-nav">
        <div class="step-nav">
          <button type="button" class="btn btn--soft" id="step-prev" aria-label="Previous step">‹ Prev</button>
          <button type="button" class="btn btn--primary" id="step-next" aria-label="Next step">Next ›</button>
        </div>
        <div class="substep-nav">
          <button type="button" class="btn btn--ghost btn--sm" id="sub-prev" aria-label="Previous detail">‹</button>
          <span class="step-subcount" id="step-subcount"></span>
          <button type="button" class="btn btn--ghost btn--sm" id="sub-next" aria-label="Next detail">›</button>
        </div>
      </footer>
    </aside>

    <button type="button" class="scrim" aria-label="Close the open panel"></button>
  </div>

  <script src="../../js/circuit.js"></script>
  <script src="../../js/generators/current-source.js"></script>
  <script src="../../js/generators/random-grid.js"></script>
  <script src="../../js/generators/basic.js"></script>
  <script src="../../js/generators/bridge-ladder.js"></script>
  <script src="../../js/generators/grid.js"></script>
  <script src="../../js/generators/multi-source.js"></script>
  <script src="../../js/solve.js"></script>
  <script src="../../js/techniques/kit.js"></script>
  <script src="../../js/techniques/controls.js"></script>
  <script src="../../js/techniques/node-voltage.js"></script>
  <script src="../../js/techniques/mesh-current.js"></script>
  <script src="../../js/stepper.js"></script>
  <script src="../../js/formats/native.js"></script>
  <script src="../../js/formats/ltspice.js"></script>
  <script src="../../js/ui/filemenu.js"></script>
  <script src="../../js/solver-page.js"></script>
  <script src="../../js/ui/shell.js"></script>
  <script>
    // this topic adds the independent current source; only KCL and KVL are taught on it
    // (equivalent resistance needs a source to deactivate — a later topic). Two circuit sets:
    // this topic's own I-bearing circuits, and the full §3 set for KCL/KVL practice on those
    // shapes — currentify() below turns some of their resistors (and, sometimes, a spare
    // voltage source) into current sources so §3's shapes get supermesh / known-mesh-current
    // practice too, rather than only ever seeing random-grid.js's.
    SolverPage({
      elements: ['R', 'V', 'I', 'W'],
      sets: [
        { value: 'current-source', label: 'Current-source circuits', filter: { tags: ['current-source'], elements: ['R', 'V', 'I', 'W'] } },
        {
          value: 'all', label: 'All topologies', filter: { elements: ['R', 'V', 'W'] },
          // Wheatstone bridge opts out — its arms are the exact teaching point, flagged by
          // its B/D node labels (see circuit.js's currentify() comment).
          transform: function (c) {
            var protectedWiring = c.nodes.some(function (n) { return n.label; });
            return protectedWiring ? c : Circuit.currentify(c, { voltage: true });
          },
        },
      ],
    });
  </script>
</body>

</html>
