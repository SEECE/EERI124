<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>circuit.js self-check</title>
</head>

<body>
  <pre id="out"></pre>
  <script src="circuit.js"></script>
  <script src="generators/random-grid.js"></script>
  <script src="generators/basic.js"></script>
  <script src="generators/bridge-ladder.js"></script>
  <script src="generators/grid.js"></script>
  <script src="generators/multi-source.js"></script>
  <script>
    var out = [];
    function check(label, fn) {
      try { fn(); out.push('PASS ' + label); }
      catch (err) { out.push('FAIL ' + label + ' — ' + err.message); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function hasSource(c) { return c.edges.some(function (e) { return e.type === 'V'; }); }
    // no source or resistor may have both ends tied together by wires
    function shorted(c) {
      var p = {};
      function find(x) { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; }
      c.nodes.forEach(function (n) { p[n.id] = n.id; });
      c.edges.forEach(function (e) { if (e.type === 'W') p[find(e.a)] = find(e.b); });
      return c.edges.some(function (e) { return e.type !== 'W' && find(e.a) === find(e.b); });
    }
    function dangling(c) {
      var deg = {};
      c.edges.forEach(function (e) { deg[e.a] = (deg[e.a] || 0) + 1; deg[e.b] = (deg[e.b] || 0) + 1; });
      return c.nodes.some(function (n) { return (deg[n.id] || 0) < 2; });
    }

    var all = Circuit.list();
    check('registry populated', function () { assert(all.length > 0, 'no generators registered'); });

    all.forEach(function (g) {
      check('generator ' + g.name + ' ×50', function () {
        for (var i = 0; i < 50; i++) { // ×50: build() randomises polarity and may short a resistor
          var c = g.generate();
          Circuit.validate(c); // ids unique, edges reference real nodes
          assert(hasSource(c), 'no voltage source');
          assert(Circuit.isConnected(c), 'not connected');
          assert(c.edges.every(function (e) { return e.type === 'W' || e.value > 0; }), 'zero-value edge');
          assert(!shorted(c), 'shorted source or resistor');
          // a generator must not emit element types it did not declare
          assert(c.edges.every(function (e) { return g.elements.indexOf(e.type) >= 0; }), 'undeclared element type');
          if (g.tags.indexOf('random') >= 0) assert(!dangling(c), 'dangling node');
        }
      });
    });

    check('reduceSeries', function () {
      var R = function (id, a, b, v) { return { id: id, type: 'R', a: a, b: b, value: v }; };
      // a two-resistor corner collapses to one resistor of the summed value
      var chain = Circuit.reduceSeries({ nodes: [{ id: 'n0' }, { id: 'n1' }, { id: 'n2' }],
        edges: [R('e0', 'n0', 'n1', 100), R('e1', 'n1', 'n2', 200)] });
      assert(chain.nodes.length === 2 && chain.edges.length === 1, 'chain not collapsed');
      assert(chain.edges[0].value === 300, 'series sum wrong: ' + chain.edges[0].value);
      // a degree-3 junction is left alone
      var star = Circuit.reduceSeries({ nodes: [{ id: 'n0' }, { id: 'n1' }, { id: 'n2' }, { id: 'n3' }],
        edges: [R('e0', 'n0', 'n1', 10), R('e1', 'n1', 'n2', 10), R('e2', 'n1', 'n3', 10)] });
      assert(star.nodes.length === 4, 'reduced a real junction');
      // cycle rank (E−V+1) is invariant on a loop of corners
      var loop = { nodes: ['n0', 'n1', 'n2', 'n3'].map(function (id) { return { id: id }; }),
        edges: [R('e0', 'n0', 'n1', 10), R('e1', 'n1', 'n2', 10), R('e2', 'n2', 'n3', 10), R('e3', 'n3', 'n0', 10)] };
      var before = loop.edges.length - loop.nodes.length + 1;
      var red = Circuit.reduceSeries(loop);
      assert(red.edges.length - red.nodes.length + 1 === before, 'cycle rank changed');
      // a corner with a source (or wire) is not a two-resistor corner → left alone
      var srcCorner = Circuit.reduceSeries({ nodes: [{ id: 'n0' }, { id: 'n1' }, { id: 'n2' }],
        edges: [{ id: 'e0', type: 'V', a: 'n0', b: 'n1', value: 12 }, R('e1', 'n1', 'n2', 100)] });
      assert(srcCorner.nodes.length === 3, 'collapsed a source terminal');
      // opt-out families keep their corner nodes — the divider tap must survive
      assert(Circuit.get('Voltage divider').generate().nodes.length === 5, 'divider tap was reduced away');
    });

    check('list filters', function () {
      assert(Circuit.list({ elements: ['R', 'V', 'W'] }).length === all.length, 'R/V/W filter dropped a generator');
      assert(Circuit.list({ elements: ['R', 'W'] }).length === 0, 'sourceless filter kept a generator');
      assert(Circuit.list({ tags: ['random'] }).length === 1, 'expected exactly one random generator');
    });

    check('render smoke', function () {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      Circuit.render(Circuit.get('Wheatstone bridge').generate(), svg);
      assert(svg.childNodes.length > 0, 'empty svg');
    });

    document.getElementById('out').textContent = out.join('\n');
    out.forEach(function (l) { console.assert(l.indexOf('PASS') === 0, l); });
  </script>
</body>

</html>
