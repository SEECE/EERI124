<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>solve.js self-check</title>
</head>

<body>
  <pre id="out"></pre>
  <script src="circuit.js"></script>
  <script src="generators/random-grid.js"></script>
  <script src="generators/basic.js"></script>
  <script src="generators/bridge-ladder.js"></script>
  <script src="generators/grid.js"></script>
  <script src="generators/multi-source.js"></script>
  <script src="generators/current-source.js"></script>
  <script src="generators/dependent.js"></script>
  <script src="solve.js"></script>
  <script src="techniques/kit.js"></script>
  <script src="techniques/controls.js"></script>
  <script src="techniques/mesh-current.js"></script>
  <script src="techniques/node-voltage.js"></script>
  <script src="techniques/equivalent-resistance.js"></script>
  <script src="stepper.js"></script>
  <script>
    var out = [];
    function check(label, fn) {
      try { fn(); out.push('PASS ' + label); }
      catch (err) { out.push('FAIL ' + label + ' — ' + err.message); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function near(a, b, t) { return Math.abs(a - b) <= (t || 1e-9); }

    // compact circuit builder for the hand-computed cases (bypasses the generators)
    function C(n, edges) {
      return {
        nodes: Array.apply(null, { length: n }).map(function (_, i) { return { id: 'n' + i, x: 0, y: 0 }; }),
        edges: edges.map(function (e, i) { return { id: 'e' + i, type: e[0], a: 'n' + e[1], b: 'n' + e[2], value: e[3] }; }),
      };
    }
    function v(sol, i) { return sol.v[sol.of['n' + i]]; }
    function src(brs) { return brs.filter(function (r) { return r.edge.type === 'V'; })[0]; }

    // ---- SI / engineering formatting ----
    check('si formatting', function () {
      var cs = [[0.1, 'A', '0.1 A'], [0.11, 'A', '110 mA'], [0.5, 'A', '0.5 A'],
        [2200, 'Ω', '2.2 kΩ'], [220, 'Ω', '220 Ω'], [0.047, 'A', '47 mA'],
        [0, 'A', '0 A'], [3.33, 'V', '3.33 V'], [-0.05, 'A', '−50 mA']];
      cs.forEach(function (t) { assert(Solve.si(t[0], t[1]) === t[2], 'si(' + t[0] + ') = "' + Solve.si(t[0], t[1]) + '" ≠ "' + t[2] + '"'); });
    });

    // ---- linear core ----
    check('linsolve 2×2', function () {
      var x = Solve.linsolve([[2, 1], [1, 3]], [3, 5]); // 2x+y=3, x+3y=5 → 0.8, 1.4
      assert(near(x[0], 0.8) && near(x[1], 1.4), JSON.stringify(x));
    });

    // ---- series: V=15 across R1=100 then R2=200 → I=0.05, mid node = 10 V ----
    check('series network', function () {
      var c = C(3, [['V', 0, 1, 15], ['R', 1, 2, 100], ['R', 2, 0, 200]]);
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 1), 15) && near(v(sol, 2), 10) && near(v(sol, 0), 0), 'node voltages wrong');
      var br = Solve.branches(c, sol);
      assert(near(src(br).current, 0.05), 'source current ≠ 0.05');
      var pc = Solve.powerCheck(br);
      assert(pc.ok && near(pc.dissipated, 0.75), 'power ' + JSON.stringify(pc));
    });

    // ---- parallel: V=10, two 100Ω in parallel → 0.2 A, 2 W ----
    check('parallel network', function () {
      var c = C(2, [['V', 0, 1, 10], ['R', 0, 1, 100], ['R', 0, 1, 100]]);
      var br = Solve.branches(c, Solve.nodeVoltages(c));
      assert(near(src(br).current, 0.2), 'source current ≠ 0.2');
      var pc = Solve.powerCheck(br);
      assert(pc.ok && near(pc.dissipated, 2), 'power ' + JSON.stringify(pc));
    });

    // ---- divider: V=12, R(300) over R(100) → tap = 3 V ----
    check('voltage divider', function () {
      var c = C(5, [['V', 0, 1, 12], ['W', 1, 2], ['R', 2, 3, 300], ['R', 3, 4, 100], ['W', 4, 0]]);
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 3), 3), 'tap ≠ 3 V (got ' + v(sol, 3) + ')');
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    // ---- two sources in series (MNA): n2 = 10 + 4 = 14 V, loop I = 14/200 = 0.07 A ----
    check('two sources in series', function () {
      var c = C(3, [['V', 0, 1, 10], ['V', 1, 2, 4], ['R', 2, 0, 200]]);
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 1), 10) && near(v(sol, 2), 14), 'node voltages ' + v(sol, 1) + ',' + v(sol, 2));
      var br = Solve.branches(c, sol);
      assert(near(Math.abs(br.filter(function (r) { return r.edge.type === 'R'; })[0].current), 0.07), 'loop current');
      assert(Solve.powerCheck(br).ok, 'power imbalance');
    });

    // ---- two sources bridging two non-reference nodes (a supernode): both fixed, power balances ----
    check('supernode (two grounded sources)', function () {
      var c = C(3, [['V', 0, 1, 12], ['V', 0, 2, 6], ['R', 1, 2, 100], ['R', 2, 0, 300]]);
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 1), 12) && near(v(sol, 2), 6), 'node voltages ' + v(sol, 1) + ',' + v(sol, 2));
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    /* ---- the supernode's ALGEBRA, not just its answer ----
       A 3×2 resistor grid with a 9 V source pinning one node and a 5 V source floating between
       two unknown ones, so a–c is a supernode and every unknown node is mutually coupled. The
       engine (MNA) always got v_a = 3.2 V, v_c = 8.2 V; what used to be wrong was the WORKING —
       KCL was written at each member on its own (false: the source's branch current is missing
       from that sum, and the four lines were not an independent system), and the solve was then
       handed to "a matrix or calculator" without ever using the constraint. These are the
       assertions that would have caught it. */
    check('supernode narration (enclosure equation, constraint used, no hand-off)', function () {
      var c = C(10, [['R', 0, 1, 100], ['R', 0, 3, 2200], ['R', 1, 2, 470], ['R', 1, 4, 1000],
        ['R', 2, 5, 330], ['R', 3, 4, 220], ['R', 4, 5, 470], ['W', 3, 6], ['V', 6, 7, 9],
        ['W', 7, 5], ['W', 0, 8], ['V', 8, 9, 5], ['W', 9, 2]]);
      var ln = Solve.letterNodes(c), sol = Solve.nodeVoltages(c);
      var ga = ln.of.n0, gc = ln.of.n2, A = ln.letter[ga], Cc = ln.letter[gc];
      assert(near(sol.v[ga], 3.2, 5e-3) && near(sol.v[gc], 8.2, 5e-3),
        'engine values moved: ' + sol.v[ga] + ', ' + sol.v[gc]);
      var steps = NodeVoltage(c), va = 'v<sub>' + A + '</sub>', vc = 'v<sub>' + Cc + '</sub>';

      // step 7: ONE equation for the pair, carrying both members' branches — and none for either
      // member alone, which is the line that could not be closed
      var labels = steps[6].eq.filter(function (l) { return /^(Node|Supernode) /.test(l); })
        .map(function (l) { return l.split(':')[0]; });
      assert(labels.indexOf('Node ' + A) < 0 && labels.indexOf('Node ' + Cc) < 0,
        'a supernode member still gets a KCL equation of its own: ' + labels.join(' | '));
      var encl = steps[6].eq.filter(function (l) { return l.indexOf('Supernode ' + A + '+' + Cc) === 0; })[0];
      assert(encl, 'no enclosure equation for the pair: ' + labels.join(' | '));
      assert(encl.indexOf(va) > 0 && encl.indexOf(vc) > 0, 'the enclosure sum is missing a member: ' + encl);
      assert(steps[6].eq.some(function (l) { return l.indexOf(vc + ' = ' + va) > 0; }),
        'the constraint is never rearranged into the form the algebra uses');

      // step 9: the constraint is substituted, the partner is recovered from it, and an
      // INDEPENDENT supernode never reaches the simultaneous hand-off
      var titles = (steps[8].subs || []).map(function (s) { return s.title; }).join(' | ');
      assert(/use the constraint/.test(titles), 'step 9 never uses the constraint: ' + titles);
      assert(titles.indexOf('node ' + Cc + ' — from the constraint') >= 0,
        'the pair’s second node is never recovered from the constraint: ' + titles);
      assert(!/solve the system/.test(titles), 'an independent supernode was handed to a matrix solve');
      // the substituted line really is the enclosure written in the lead's symbol
      var used = (steps[8].subs || []).filter(function (s) { return /use the constraint/.test(s.title); })[0];
      var line = used.eq[used.eq.length - 1];
      assert(line.indexOf(vc) < 0 && line.indexOf(va + ' + 5') > 0, 'constraint not actually substituted: ' + line);
    });

    // ---- current source into two parallel 100 Ω: v = 0.1 × 50 = 5 V, 0.5 W generated ----
    check('current source (parallel)', function () {
      var c = C(2, [['I', 0, 1, 0.1], ['R', 0, 1, 100], ['R', 0, 1, 100]]);
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 1), 5), 'node voltage ' + v(sol, 1) + ' ≠ 5 V');
      var pc = Solve.powerCheck(Solve.branches(c, sol));
      assert(pc.ok && near(pc.generated, 0.5), 'power ' + JSON.stringify(pc));
    });

    // ---- a current source bordering one mesh fixes that mesh current outright (PPT step 3) ----
    check('known mesh current', function () {
      // one loop: 0.05 A source driving 100 Ω + 200 Ω in series
      var c = C(3, [['I', 0, 1, 0.05], ['R', 1, 2, 100], ['R', 2, 0, 200]]);
      var mc = Solve.meshCurrents(c);
      assert(mc.groups.length === 1 && mc.groups[0].fixed, 'source against the outer face should fix its group');
      assert(near(Math.abs(mc.i[0]), 0.05), 'mesh current ' + mc.i[0] + ' ≠ ±0.05 A');
      assert(near(Math.abs(mc.edgeCurrent[c.edges[1].id]), 0.05), 'resistor current ≠ source current');
    });

    // ---- a current source shared by two meshes → supermesh + constraint (PPT steps 5 & 7) ----
    check('supermesh', function () {
      var c = Circuit.get('Supermesh (shared current source)').generate();
      var mc = Solve.meshCurrents(c);
      var sm = mc.groups.filter(function (g) { return g.meshes.length > 1; });
      assert(sm.length === 1 && sm[0].meshes.length === 2, 'expected one 2-mesh supermesh');
      assert(!sm[0].fixed, 'a shared source fixes nothing on its own');
      var s = mc.iSources[0], i = mc.i;
      assert(near(i[mc.meshOf[s.fa]] - i[mc.meshOf[s.fb]], s.e.value), 'constraint i_fa − i_fb = I not satisfied');
      assert(Solve.powerCheck(Solve.branches(c, Solve.nodeVoltages(c))).ok, 'power imbalance');
    });

    // ---- two current sources on ONE mesh ----
    // KVL round that loop is one equation in two unknown source voltages, so the mesh method's
    // step 9 cannot pin either. The circuit is still a circuit and energy is still conserved,
    // so step 10 must read ✓ (it used to drop both terms and report Σgen short) — and the
    // random generator must not hand one out, since step 9 has nothing to teach on it.
    var meshClash = Circuit.meshClash;
    check('two current sources on one mesh', function () {
      var c = Circuit.build(
        [[0, 0], [1.5, 0], [3, 0], [0, 1.5], [1.5, 1.5], [3, 1.5], [0, -1.5], [3, -1.5]],
        [['R', 0, 1, 470], ['R', 0, 3, 3300], ['I', 1, 2, 0.05], ['R', 1, 4, 4700], ['I', 2, 5, 0.01],
          ['R', 3, 4, 2200], ['W', 4, 5], ['W', 0, 6], ['V', 7, 6, 15], ['W', 7, 2]]);
      assert(meshClash(c), 'specimen no longer puts two current sources on one mesh');
      assert(Solve.powerCheck(Solve.branches(c, Solve.nodeVoltages(c))).ok, 'node-voltage power imbalance');
      var eq = window.MeshCurrent(c).filter(function (s) { return s.n === 10; })[0].eq.join(' ');
      assert(/✓/.test(eq), 'mesh power check reads ✗: ' + eq);
      for (var k = 0; k < 40; k++) assert(!meshClash(Circuit.get('Random (current sources)').generate()),
        'generator produced two current sources on one mesh');
      // the same must hold for the "All topologies" set, which currentifies §3's shapes
      Circuit.list({ elements: ['R', 'V', 'W'] }).forEach(function (g) {
        for (var i = 0; i < 10; i++) {
          var t = g.generate();
          if (t.nodes.some(function (n) { return n.label; })) continue;   // bridge opts out
          assert(!meshClash(Circuit.currentify(t, { voltage: true })), 'currentify(' + g.name + ') clashed');
        }
      });
    });

    // ---- the four controlled sources, each against a hand-worked answer ----
    // A CCVS of 500·iφ in series with 1 kΩ + 2 kΩ off a 12 V source: KVL round the loop gives
    // 12 = 1000i + 2000i + 500i (the source opposes), so i = 12/2500 = 4.8 mA.
    check('CCVS (current-controlled voltage source)', function () {
      var c = C(4, [['V', 0, 1, 12], ['R', 1, 2, 1000], ['R', 2, 3, 2000], ['H', 3, 0, 500]]);
      c.edges[3].control = 'e1';
      var sol = Solve.nodeVoltages(c);
      assert(near(sol.ctrl['e3'], 0.0048, 1e-9), 'iφ = ' + sol.ctrl['e3'] + ' ≠ 4.8 mA');
      assert(near(v(sol, 2), 7.2, 1e-9) && near(v(sol, 3), -2.4, 1e-9), 'node voltages ' + v(sol, 2) + ',' + v(sol, 3));
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    // A VCVS of 2·vΔ, vΔ across the 1 kΩ: 12 = 1000i + 2000i − 2·(1000i) → i = 12 mA.
    check('VCVS (voltage-controlled voltage source)', function () {
      var c = C(4, [['V', 0, 1, 12], ['R', 1, 2, 1000], ['R', 2, 3, 2000], ['E', 3, 0, 2]]);
      c.edges[3].control = 'e1';
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 2), 0, 1e-9) && near(v(sol, 3), -24, 1e-9), 'node voltages ' + v(sol, 2) + ',' + v(sol, 3));
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    // A CCCS of 3·iφ across the 2 kΩ, iφ through the 1 kΩ:
    // KCL at the tap → (v−12)/1000 + v/2000 + 3(12−v)/1000 = 0 → v = 16 V.
    check('CCCS (current-controlled current source)', function () {
      var c = C(3, [['V', 0, 1, 12], ['R', 1, 2, 1000], ['R', 2, 0, 2000], ['F', 2, 0, 3]]);
      c.edges[3].control = 'e1';
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 2), 16, 1e-9), 'tap ' + v(sol, 2) + ' ≠ 16 V');
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    // A VCCS of vΔ/500, vΔ across the 1 kΩ: same sum with 4(12−v)/2000 → v = 24 V.
    check('VCCS (voltage-controlled current source)', function () {
      var c = C(3, [['V', 0, 1, 12], ['R', 1, 2, 1000], ['R', 2, 0, 2000], ['G', 2, 0, 1 / 500]]);
      c.edges[3].control = 'e1';
      var sol = Solve.nodeVoltages(c);
      assert(near(v(sol, 2), 24, 1e-9), 'tap ' + v(sol, 2) + ' ≠ 24 V');
      assert(near(sol.depI['e3'], (12 - 24) / 500, 1e-9), 'source current ' + sol.depI['e3']);
      assert(Solve.powerCheck(Solve.branches(c, sol)).ok, 'power imbalance');
    });

    // ---- a controlled boundary current source gives no KVL row, but no VALUE either ----
    check('dependent boundary source is fixed but not known', function () {
      var c = Circuit.get('Supermesh (shared dependent current source)').generate();
      var mc = Solve.meshCurrents(c);
      var sm = mc.groups.filter(function (g) { return g.meshes.length > 1; });
      assert(sm.length === 1, 'a shared controlled source should still weld one supermesh');
      assert(!sm[0].known, 'a controlled source never hands its value over outright');
      var s = mc.iSources[0];
      assert(s.dep, 'the shared source should be flagged dependent');
      assert(near(mc.i[mc.meshOf[s.fa]] - mc.i[mc.meshOf[s.fb]], s.e.value * mc.ctrlVec(s.e).reduce(function (a, x, j) { return a + x * mc.i[j]; }, 0), 1e-9),
        'constraint i_fa − i_fb = gain·control not satisfied');
    });

    // ---- every generator: node-voltage solves, mesh agrees, power balances ----
    Circuit.list().forEach(function (g) {
      check('solve ' + g.name + ' ×30', function () {
        for (var i = 0; i < 30; i++) {
          var c = g.generate();
          var sol = Solve.nodeVoltages(c);
          Object.keys(sol.v).forEach(function (grp) { assert(isFinite(sol.v[grp]), 'non-finite node voltage'); });
          var br = Solve.branches(c, sol);
          assert(br.every(function (r) { return isFinite(r.current) && isFinite(r.power); }), 'non-finite branch');
          assert(Solve.powerCheck(br).ok, 'power imbalance in ' + g.name);

          // mesh (KVL) must find E−V+1 bounded faces and agree with node-voltage per resistor
          var mc = Solve.meshCurrents(c);
          assert(mc.meshes.length === c.edges.length - c.nodes.length + 1, 'mesh count ≠ E−V+1');
          br.forEach(function (r) {
            if (r.edge.type === 'W') return;
            var im = mc.edgeCurrent[r.edge.id], iv = r.current;   // signed: the two methods must agree on direction too
            assert(Math.abs(im - iv) <= 1e-6 * (Math.abs(iv) + 1), 'mesh current ≠ node-voltage current on ' + r.edge.type);
          });
        }
      });
    });

    // ---- KVL technique step list: loops persist, and the narrated algebra lands on the engine ----
    Circuit.list().forEach(function (g) {
      check('KVL steps ' + g.name + ' ×10', function () {
        for (var i = 0; i < 10; i++) {
          var c = g.generate(), mc = Solve.meshCurrents(c), steps = MeshCurrent(c);
          assert(steps.length === 10, '10 PPT steps expected, got ' + steps.length);
          steps.forEach(function (s, k) {
            [s].concat(s.subs || []).forEach(function (view) {
              var loops = view.hl && view.hl.loops;
              if (k === 0) assert(!loops, 'step 1 draws loops too early');
              // steps 5-8 draw a supermesh as ONE loop over its meshes, so there the count is
              // the number of groups; everywhere else it is one arrow per mesh
              else assert(loops && loops.length === (s.n >= 5 && s.n <= 8 ? mc.groups.length : mc.meshes.length),
                'step ' + s.n + ' dropped the mesh loops');
            });
          });
          assert(!/undefined|NaN/.test(JSON.stringify(steps)), 'step text has undefined/NaN');
          // step 4 must meet every shared resistor twice and show it both ways round (3 eq lines)
          var shared = c.edges.filter(function (e, k) {
            var fa = mc.F.faceOf[2 * k], fb = mc.F.faceOf[2 * k + 1];
            return e.type === 'R' && fa !== fb && fa !== mc.F.outer && fb !== mc.F.outer;
          }).length;
          var bothWays = (steps[3].subs || []).filter(function (view) { return (view.eq || []).length === 3; }).length;
          assert(bothWays === shared, shared + ' shared resistors but ' + bothWays + ' both-ways views in step 4');
          // the running board is a pinned panel field, never baked into the body text, and from
          // step 6 (first equation written) on it must never blank out — in either technique
          var kcl = NodeVoltage(c);
          assert(!/undefined|NaN/.test(JSON.stringify(kcl)), 'KCL step text has undefined/NaN');
          /* One KCL equation per UNIT: a node appears in at most one of step 7's equation labels,
             so a supernode's pair is one enclosure line and never two. A per-member line leaves
             out the source's own branch current — it is not a true equation, whatever the engine
             then answers. */
          var seenIn = {}, lnc = Solve.letterNodes(c);
          kcl[6].eq.filter(function (l) { return /^(Node|Supernode) /.test(l); }).forEach(function (l) {
            var letters = l.split(':')[0].replace(/^(Node|Supernode) /, '').split('+');
            letters.forEach(function (nm) {
              assert(!seenIn[nm], 'node ' + nm + ' gets more than one KCL equation in step 7');
              seenIn[nm] = 1;
            });
            /* …and a sum only closes when every voltage source touching it has BOTH ends inside:
               that is the only way its own branch current cancels. One end out — a controlled
               source pinning a member to an already-known node — leaves an unknown current
               crossing the boundary, and then no KCL can be written for that group at all. */
            var inside = {};
            lnc.groups.forEach(function (grp) { if (letters.indexOf(lnc.letter[grp]) >= 0) inside[grp] = 1; });
            c.edges.forEach(function (e) {
              if (e.type !== 'V' && e.type !== 'E' && e.type !== 'H') return;
              assert(!inside[lnc.of[e.a]] === !inside[lnc.of[e.b]],
                'the ' + e.type + ' source ' + e.id + ' crosses the enclosure of "' + letters.join('+') +
                '", so that KCL sum cannot be written');
            });
          });
          /* KCL runs one step longer than KVL: its step 4 is the convention the student states
             (Σ leaving = 0 by default, Σ in = Σ out the other way), so its assumption step is 5
             and its first equation lands in step 7. `mark` is where each technique's assumption
             marks start, `bd` the first step that must carry the board, `sv` the solve step. */
          var SHAPE = function (list) {
            return list === kcl ? { mark: 4, bd: 6, sv: 9 } : { mark: 3, bd: 5, sv: 8 };
          };
          // step 4's marks are keyed '<edgeId>:<terminalNodeId>' — KVL's polarity pairs (pol) and
          // KCL's leaving-current arrows (flow). Only what the renderer pre-drew can be revealed,
          // so a key naming the wrong terminal shows nothing; and once marked they stay to the end.
          if (i === 0) {
            var psvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            Circuit.render(c, psvg);
            var drawn = {};
            Array.prototype.forEach.call(psvg.querySelectorAll('.pol-mark'), function (pg) { drawn[pg.getAttribute('data-pol')] = 1; });
            Array.prototype.forEach.call(psvg.querySelectorAll('.flow-mark'), function (pg) { drawn[pg.getAttribute('data-flow')] = 1; });
            var marksOf = function (view) { return (((view.hl || {}).pol) || []).concat(((view.hl || {}).flow) || []); };
            [steps, kcl].forEach(function (list) {
              var mk = SHAPE(list).mark;
              if (!marksOf(list[mk]).length) return;        // no unknown node → no KCL, nothing marked
              list.slice(mk).forEach(function (s2) {
                [s2].concat(s2.subs || []).forEach(function (view) {
                  var keys = marksOf(view);
                  // inside the assumption step the set is still growing (its first walk view has none yet)
                  if (s2.n > mk + 1) assert(keys.length, 'step ' + s2.n + ' view "' + (view.title || 'overview') + '" lost step ' + (mk + 1) + '’s marks');
                  keys.forEach(function (key) { assert(drawn[key], 'step ' + (mk + 1) + ' mark ' + key + ' is not on the drawing'); });
                });
              });
            });
          }
          [steps, kcl].forEach(function (list) {
            list.forEach(function (s2) {
              [s2].concat(s2.subs || []).forEach(function (view) {
                assert(!/eq-board/.test(view.body || ''), 'step ' + s2.n + ' still has the board inside its body');
              });
            });
            list.slice(SHAPE(list).bd).forEach(function (s2) {
              [s2].concat(s2.subs || []).forEach(function (view) {
                assert(/eq-board/.test(view.board || ''), 'step ' + s2.n + ' view "' + (view.title || 'overview') + '" lost its board');
              });
            });
          });
          // a step's own eq is its RESULT summary and the stepper hides it on the overview of a
          // step that has substeps (answers before the derivation read as if it were undone), so
          // every such step from the solve on must end on a substep that shows the results
          [steps, kcl].forEach(function (list) {
            list.forEach(function (s2) {
              if (s2.n < SHAPE(list).sv || !(s2.subs || []).length || !(s2.eq || []).length) return;
              var last = s2.subs[s2.subs.length - 1];
              assert((last.eq || []).length, 'step ' + s2.n + ' hides its results with no recap substep');
            });
          });
          // the substitution chain reaching the engine's number is what makes "falls out" a
          // single line; two lines would mean the hand algebra and the solver disagree
          var hasDep = c.edges.some(function (e) { return Circuit.isDependent(e.type); });
          if (!hasDep) (steps[7].subs || []).forEach(function (view) {
            if (/ — falls out$/.test(view.title)) assert(view.eq.length === 1, 'substitution chain ended at ' + view.eq[0] + ', engine says ' + view.eq[1]);
          });
          // whatever route the narration took, the last board must show every solved value —
          // this is the invariant that a dependent circuit must not lose
          function lastBoard(list) {
            var b = null;
            list.forEach(function (s2) { [s2].concat(s2.subs || []).forEach(function (view) { if (view.board) b = view.board; }); });
            return b;
          }
          var ln = Solve.letterNodes(c), nsol = Solve.nodeVoltages(c), kb = lastBoard(kcl);
          ln.groups.forEach(function (grp) {
            assert(kb.indexOf('<td>' + Solve.si(nsol.v[grp], 'V') + '</td>') >= 0,
              'KCL board never reached ' + ln.letter[grp] + ' = ' + Solve.si(nsol.v[grp], 'V'));
          });
          /* KCL's step 4 is the convention the student states. It must default to the phrasing
             the module teaches, mark whichever one is in force — and change NOTHING else: the
             same circuit written Σ in = Σ out has to land on the same board. */
          assert(kcl.length === 10, '10 KCL steps expected (the PPT’s 9 plus the convention), got ' + kcl.length);
          assert(/data-kcl-conv="leaving"[^>]*aria-pressed="true"/.test(kcl[3].body), 'step 4 does not default to Σ leaving = 0');
          var inout = NodeVoltage(c, { kcl: 'inout' });
          assert(/data-kcl-conv="inout"[^>]*aria-pressed="true"/.test(inout[3].body), 'step 4 does not mark the chosen convention');
          assert(lastBoard(inout) === kb, 'the KCL convention changed an answer');
          var mb = lastBoard(steps);
          mc.order.forEach(function (f, idx) {
            assert(mb.indexOf('<td>' + Solve.si(mc.i[mc.meshOf[f]], 'A') + '</td>') >= 0,
              'KVL board never reached i' + (idx + 1) + ' = ' + Solve.si(mc.i[mc.meshOf[f]], 'A'));
          });
        }
      });
    });

    // ---- shared assertions for any technique's step list ----
    function noNaN(steps, label) {
      assert(steps.length, label + ': no steps');
      assert(!/undefined|NaN|Infinity/.test(JSON.stringify(steps)), label + ' step text has undefined/NaN/Infinity');
      steps.forEach(function (s, k) {
        assert(s.n === k + 1, label + ': steps numbered ' + steps.map(function (x) { return x.n; }).join(','));
        [s].concat(s.subs || []).forEach(function (view) {
          assert(String(view.title || s.title).trim(), label + ' step ' + s.n + ' has no title');
          assert(String(view.body != null ? view.body : s.body).trim(), label + ' step ' + s.n + ' has no body');
          assert(!/eq-board/.test(view.body || ''), label + ' step ' + s.n + ' baked the board into its body');
        });
      });
    }
    function reqOf(c) {
      var v = c.edges.filter(function (e) { return e.type === 'V'; })[0];
      var b = Solve.branches(c, Solve.nodeVoltages(c));
      return v.value / Math.abs(b.filter(function (r) { return r.edge.id === v.id; })[0].current);
    }

    /* ---- equivalent resistance: the reduction is pedagogy, V/I is the truth ----
       Single-source circuits only. With more than one source, "the resistance the source sees"
       is not V/I at all: EquivResistance removes the FIRST source and reduces the resistor
       network between its terminals, while the others go on pushing current through it. That is
       a known limit of the technique, not a slip in the reduction.

       The reduction is now expected to FINISH on every generator — the Y→Δ transform opens the
       bridges that used to stall it — so `reduced` (what the moves themselves landed on) is
       checked against `req` (nodal). That equality is what proves the transform's arithmetic:
       one wrong divisor and the two part company. */
    check('equivalent resistance agrees with V/I', function () {
      Circuit.list({ elements: ['R', 'V', 'W'] }).forEach(function (g) {
        for (var i = 0; i < 8; i++) {
          var c = g.generate(), st = EquivResistance(c);
          noNaN(st, 'Req/' + g.name);
          // every step past the goal puts its own network on the canvas, and highlights ids that
          // exist in the model it drew — a stale id would light nothing at all
          st.forEach(function (s) {
            [s].concat(s.subs || []).forEach(function (view) {
              var model = view.draw || s.draw;
              if (s.n === 1 && !model) return;                 // the goal step shows the circuit itself
              assert(model && model.nodes.length, g.name + ' step ' + s.n + ' draws no network');
              var ids = model.edges.map(function (e) { return e.id; });
              (((view.hl || s.hl || {}).edges) || []).forEach(function (id) {
                assert(ids.indexOf(id) >= 0, g.name + ' step ' + s.n + ' highlights ' + id + ', not on its drawing');
              });
            });
          });
          if (c.edges.filter(function (e) { return e.type === 'V'; }).length !== 1) continue;
          assert(near(st.req, reqOf(c)), g.name + ': Req ' + st.req + ' ≠ V/I ' + reqOf(c));
          assert(!st.stuck, g.name + ': the reduction stalled');
          assert(near(st.reduced, st.req, 1e-6 * (1 + st.req)),
            g.name + ': the reduction landed on ' + st.reduced + ', not Req ' + st.req);
        }
      });
    });

    /* ---- the Y→Δ move: a bridge is the whole reason it exists ---- */
    check('a bridge is opened by a Y→Δ transform', function () {
      for (var i = 0; i < 8; i++) {
        var st = EquivResistance(Circuit.get('Wheatstone bridge').generate());
        var t = st.filter(function (s) { return /Y→Δ/.test(s.title); })[0];
        assert(t, 'no Y→Δ step on a Wheatstone bridge');
        // why it stalled → spot the Y → the rule → the numbers → the redraw
        assert(t.subs.length === 5, 'the Y→Δ step walks ' + t.subs.length + ' details, expected 5');
        assert(t.subs[4].draw, 'the Y→Δ step never redraws the network');
        // one real node fewer — the star's centre. (Bend nodes are drawing scaffolding for the
        // parallel pairs the Δ just created, so they don't count.)
        function real(m) { return m.nodes.filter(function (nd) { return nd.id.indexOf('bend-') !== 0; }).length; }
        assert(real(t.subs[4].draw) === real(t.draw) - 1, 'the Y→Δ redraw did not lose the star centre');
      }
    });

    /* ---- the canvas follows the walk (js/stepper.js `draw`) ----
       Equivalent resistance is the one technique whose steps change the network, so it hands the
       stepper a model per step and the canvas is redrawn. KCL and KVL bring none, so their canvas
       must stay the page's circuit from the first view to the last. Either way, a view may only
       highlight ids that are actually on the drawing in front of the student. */
    check('the stepper draws whatever network the step brought', function () {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      var box = {};
      ['count', 'subcount', 'title', 'body', 'eq', 'board'].forEach(function (k) { box[k] = document.createElement('div'); });
      ['prev', 'next', 'subPrev', 'subNext'].forEach(function (k) { box[k] = document.createElement('button'); });
      function drawnIds() {
        return Array.prototype.map.call(svg.querySelectorAll('[data-eid]'), function (g) {
          return g.getAttribute('data-eid');
        }).sort().join(',');
      }
      function walk(steps, c, label) {
        var st = Stepper(StepKit.extend(box, { svg: svg }));
        st.load(steps, c);
        var seen = {}, guard = 0;
        while (guard++ < 600) {
          var cur = st.current(), hl = cur.view.hl || {};
          var where = label + ' step ' + cur.step.n + (cur.sub ? ' detail ' + cur.sub : '');
          (hl.edges || []).forEach(function (id) {
            assert(svg.querySelector('[data-eid="' + id + '"]'), where + ' highlights ' + id + ', not on the canvas');
          });
          (hl.labels || []).forEach(function (id) {
            var t = svg.querySelector('[data-nlabel="' + id + '"]');
            assert(t && t.classList.contains('show'), where + ' never reveals the letter at ' + id);
          });
          seen[drawnIds()] = 1;
          if (cur.index === cur.total - 1 && cur.sub === cur.subTotal) break;
          box.subNext.click();
        }
        return Object.keys(seen).length;
      }
      Circuit.list({ elements: ['R', 'V', 'W'] }).forEach(function (g) {
        var c = g.generate();
        c.nodes.forEach(function (n) { delete n.label; });
        var req = EquivResistance(c);
        assert(walk(req, c, g.name + '/Req') > 1, g.name + ': the Req walk never redrew the network');
        c.nodes.forEach(function (n) { delete n.label; });
        assert(walk(NodeVoltage(c), c, g.name + '/KCL') === 1, g.name + ': KCL redrew the canvas');
        c.nodes.forEach(function (n) { delete n.label; });
        assert(walk(MeshCurrent(c), c, g.name + '/KVL') === 1, g.name + ': KVL redrew the canvas');
      });
    });

    document.getElementById('out').textContent = out.join('\n');
    out.forEach(function (l) { console.assert(l.indexOf('PASS') === 0, l); });
  </script>
</body>

</html>
