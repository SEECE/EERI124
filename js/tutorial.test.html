<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>tutorial pages self-check</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #14102a; color: #ece9fb; padding: 16px; }
    #stage { position: absolute; left: -10000px; top: 0; width: 1200px; }
  </style>
</head>

<body>
  <pre id="out"></pre>

  <!-- Both pages' own markup, off-screen: the labs are mounted for real and driven, rather
       than having their arithmetic re-implemented here. The ids carry a per-page prefix
       (dy- / wb-) only because two pages that each own #figure and #lesson-body cannot both
       be mounted in one document; each real page passes no prefix. Keep these in step with
       topics/delta-wye/index.html and topics/wheatstone-bridge/index.html. -->
  <div id="stage" aria-hidden="true">
    <!-- Δ-Y -->
    <button type="button" id="dy-dir-dy" aria-pressed="true">Δ → Y</button>
    <button type="button" id="dy-dir-yd" aria-pressed="false">Y → Δ</button>
    <div id="dy-presets">
      <button type="button" data-preset="equal">Equal</button>
      <button type="button" data-preset="spread">Spread</button>
      <button type="button" data-preset="random">Random</button>
    </div>
    <button type="button" id="dy-practice" aria-pressed="false">Practice mode: off</button>
    <svg id="dy-figure" viewBox="0 0 720 360"></svg>
    <span id="dy-given-label"></span><span id="dy-out-label"></span>
    <div id="dy-dials"></div>
    <div id="dy-results"></div>
    <span id="dy-lesson-count"></span>
    <h2 id="dy-lesson-title"></h2>
    <div id="dy-lesson-body"></div>
    <button type="button" id="dy-lesson-prev"></button>
    <div id="dy-lesson-dots"></div>
    <button type="button" id="dy-lesson-next"></button>

    <!-- Wheatstone -->
    <span id="wb-verdict"></span>
    <button type="button" id="wb-mode-explore" aria-pressed="true">Explore</button>
    <button type="button" id="wb-mode-measure" aria-pressed="false">Measure</button>
    <div id="wb-detectors">
      <button type="button" data-detector="ideal" aria-pressed="true">Ideal</button>
      <button type="button" data-detector="100" aria-pressed="false">100 Ω</button>
      <button type="button" data-detector="10" aria-pressed="false">10 Ω</button>
    </div>
    <svg id="wb-figure" viewBox="0 0 760 400"></svg>
    <div id="wb-dials"></div>
    <div id="wb-results"></div>
    <div id="wb-unknown" hidden><span id="wb-unknown-out"></span></div>
    <button type="button" id="wb-new-unknown"></button>
    <button type="button" id="wb-reveal"></button>
    <span id="wb-lesson-count"></span>
    <h2 id="wb-lesson-title"></h2>
    <div id="wb-lesson-body"></div>
    <button type="button" id="wb-lesson-prev"></button>
    <div id="wb-lesson-dots"></div>
    <button type="button" id="wb-lesson-next"></button>

    <!-- Philosophy -->
    <span id="ph-verdict"></span>
    <div id="ph-specimens"></div>
    <svg id="ph-figure"></svg>
    <div id="ph-node-tally"></div>
    <div id="ph-mesh-tally"></div>
    <span id="ph-lesson-count"></span>
    <h2 id="ph-lesson-title"></h2>
    <div id="ph-lesson-body"></div>
    <button type="button" id="ph-lesson-prev"></button>
    <div id="ph-lesson-dots"></div>
    <button type="button" id="ph-lesson-next"></button>

    <!-- Conventions -->
    <div class="board">
      <span id="cv-verdict"></span>
      <div class="seg" id="cv-level">
        <button type="button" data-level="basic" aria-pressed="false">One loop</button>
        <button type="button" data-level="split" aria-pressed="true">One split</button>
        <button type="button" data-level="grid" aria-pressed="false">Exam grid</button>
      </div>
      <div class="seg" id="cv-mode">
        <button type="button" data-mode="kcl" aria-pressed="true">KCL</button>
        <button type="button" data-mode="kvl" aria-pressed="false">KVL</button>
      </div>
      <button type="button" id="cv-reset"></button>
      <div class="figure"><svg id="cv-figure" viewBox="0 0 720 360"></svg></div>
      <div id="cv-choices"></div>
      <div id="cv-wrote"></div>
      <div id="cv-invariant"></div>
    </div>
    <span id="cv-lesson-count"></span>
    <h2 id="cv-lesson-title"></h2>
    <div id="cv-lesson-body"></div>
    <button type="button" id="cv-lesson-prev"></button>
    <div id="cv-lesson-dots"></div>
    <button type="button" id="cv-lesson-next"></button>
  </div>

  <script src="circuit.js"></script>
  <script src="solve.js"></script>
  <script src="tutorial/draw.js"></script>
  <script src="tutorial/lesson.js"></script>
  <script src="tutorial/delta-wye.js"></script>
  <script src="tutorial/wheatstone.js"></script>
  <script src="tutorial/philosophy.js"></script>
  <script src="tutorial/conventions.js"></script>
  <script>
    var out = [];
    function check(label, fn) {
      try { fn(); out.push('PASS ' + label); }
      catch (err) { out.push('FAIL ' + label + ' — ' + err.message); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function near(a, b, t) { return Math.abs(a - b) <= (t || 1e-9) * (Math.abs(a) + Math.abs(b) + 1); }
    function rnd(hi) { return 1 + Math.random() * (hi || 900); }
    function $(id) { return document.getElementById(id); }
    function text(id) { return $(id).textContent; }

    // Every chapter is re-rendered from the LIVE values on each refresh, so a chapter that
    // captured a stale number prints it here, and a missing one prints "undefined".
    function walkChapters(lab, prefix, label) {
      var dots = $(prefix + 'lesson-dots').children.length;
      assert(dots >= 8, label + ': only ' + dots + ' chapters');
      for (var i = 0; i < dots; i++) {
        lab.lesson.go(i);
        var t = text(prefix + 'lesson-title') + ' ' + text(prefix + 'lesson-body');
        assert(!/undefined|NaN|\[object/.test(t), label + ' chapter ' + (i + 1) + ': ' + t.slice(0, 160));
        assert(t.length > 100, label + ' chapter ' + (i + 1) + ' is empty');
      }
    }

    // ==================== Δ-Y: the transform as pure arithmetic ====================

    check('Δ-Y — hand-worked Δ 30/30/30 ↔ Y 10/10/10', function () {
      var y = DeltaWyeLab.toWye({ ab: 30, bc: 30, ca: 30 });
      assert(near(y.a, 10) && near(y.b, 10) && near(y.c, 10), 'Δ→Y gave ' + JSON.stringify(y));
      var d = DeltaWyeLab.toDelta({ a: 10, b: 10, c: 10 });
      assert(near(d.ab, 30) && near(d.bc, 30) && near(d.ca, 30), 'Y→Δ gave ' + JSON.stringify(d));
    });

    // A Δ-Y transform is an IDENTITY. If a round trip moves a value, the formulas are wrong
    // and every number the page shows a student is wrong with them.
    check('Δ-Y — Δ→Y→Δ returns the same network (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var d = { ab: rnd(), bc: rnd(), ca: rnd() }, back = DeltaWyeLab.toDelta(DeltaWyeLab.toWye(d));
        assert(near(back.ab, d.ab) && near(back.bc, d.bc) && near(back.ca, d.ca),
          JSON.stringify(d) + ' → ' + JSON.stringify(back));
      }
    });

    check('Δ-Y — Y→Δ→Y returns the same network (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var y = { a: rnd(), b: rnd(), c: rnd() }, back = DeltaWyeLab.toWye(DeltaWyeLab.toDelta(y));
        assert(near(back.a, y.a) && near(back.b, y.b) && near(back.c, y.c),
          JSON.stringify(y) + ' → ' + JSON.stringify(back));
      }
    });

    // …and this is WHY it is an identity, which is what chapters 2–4 teach: the three
    // terminal-pair readings are all an outside observer can ever measure.
    check('Δ-Y — all three terminal-pair readings agree (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var d = { ab: rnd(), bc: rnd(), ca: rnd() };
        var rd = DeltaWyeLab.readsD(d), ry = DeltaWyeLab.readsY(DeltaWyeLab.toWye(d));
        assert(near(rd.AB, ry.AB) && near(rd.BC, ry.BC) && near(rd.CA, ry.CA),
          JSON.stringify(rd) + ' vs ' + JSON.stringify(ry));
      }
    });

    // ==================== Δ-Y: the page ====================

    var dy = DeltaWyeLab({ prefix: 'dy-' });

    check('Δ-Y — the figure draws both networks, six resistors', function () {
      var n = $('dy-figure').querySelectorAll('polyline').length;
      assert(n === 6, 'drew ' + n + ' resistors');
    });

    check('Δ-Y — three dials and three results', function () {
      var d = $('dy-dials').querySelectorAll('input').length;
      var r = $('dy-results').querySelectorAll('.result').length;
      assert(d === 6 && r === 3, 'inputs=' + d + ' results=' + r);
    });

    check('Δ-Y — every Δ→Y chapter renders', function () { walkChapters(dy, 'dy-', 'Δ→Y'); });

    check('Δ-Y — moving a dial keeps the student on their chapter', function () {
      dy.lesson.go(5);
      dy.set([220, 47, 15]);
      assert(dy.lesson.index() === 5, 'the refresh jumped to chapter ' + (dy.lesson.index() + 1));
      assert(!/undefined|NaN/.test(text('dy-lesson-body')), 'chapter broke');
    });

    // The page-level version of the identity above: flipping the direction hands the computed
    // values back as givens, so Δ→Y→Δ must land on the numbers the student started with.
    check('Δ-Y — flipping the direction twice restores the Δ', function () {
      dy.setDir('dy');
      dy.set([30, 20, 10]);
      var b = dy.state().delta, was = { ab: b.ab, bc: b.bc, ca: b.ca };
      dy.setDir('yd');
      dy.setDir('dy');
      var now = dy.state().delta;
      assert(near(now.ab, was.ab) && near(now.bc, was.bc) && near(now.ca, was.ca),
        JSON.stringify(was) + ' → ' + JSON.stringify(now));
    });

    check('Δ-Y — every Y→Δ chapter renders', function () {
      dy.setDir('yd');
      walkChapters(dy, 'dy-', 'Y→Δ');
      assert($('dy-figure').querySelectorAll('polyline').length === 6, 'the figure lost a resistor');
      assert(!/undefined|NaN/.test(text('dy-results')), 'results: ' + text('dy-results'));
      dy.setDir('dy');
    });

    check('Δ-Y — practice mode hides every answer, and a peek returns one', function () {
      dy.set([30, 20, 10]);
      $('dy-practice').click();
      var chips = $('dy-results').querySelectorAll('.peek');
      assert(chips.length === 3, 'expected 3 hidden results, got ' + chips.length);
      assert(text('dy-figure').indexOf('?') >= 0, 'the figure still shows the answers');
      chips[0].click();
      assert($('dy-results').querySelectorAll('.peek').length === 2, 'revealing one did not stick');
      $('dy-practice').click();
      assert($('dy-results').querySelectorAll('.peek').length === 0, 'an answer stayed hidden');
    });

    check('Δ-Y — every preset gives a usable network', function () {
      var btns = $('dy-presets').querySelectorAll('[data-preset]');
      assert(btns.length === 3, 'found ' + btns.length + ' presets');
      for (var i = 0; i < btns.length; i++) {
        btns[i].click();
        var y = dy.state().wye;
        assert(Object.keys(y).every(function (k) { return isFinite(y[k]) && y[k] > 0; }),
          btns[i].getAttribute('data-preset') + ' → ' + JSON.stringify(y));
        assert(!/undefined|NaN/.test(text('dy-results')), 'results: ' + text('dy-results'));
      }
    });

    // ==================== Wheatstone: the engine against the derivation ====================

    check('bridge — hand-worked 100/200/150/300 at 10 V balances at 6 V', function () {
      var s = { R1: 100, R2: 200, R3: 150, Rx: 300, V: 10, Rg: null };
      var p = WheatstoneLab.products(s);
      assert(p.left === 30000 && p.right === 30000, 'products ' + JSON.stringify(p));
      assert(WheatstoneLab.balanced(s), 'not reported balanced');
      var a = WheatstoneLab.analyse(s);
      assert(near(a.vP, 6) && near(a.vQ, 6) && near(a.vPQ, 0), JSON.stringify(a));
    });

    // The guide DERIVES the two dividers, then shows the engine's answer beside them. With an
    // ideal detector the two must agree exactly, or the guide is teaching something the page
    // then contradicts.
    check('bridge — an ideal detector reproduces the two dividers (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var s = { R1: rnd(600), R2: rnd(600), R3: rnd(600), Rx: rnd(600), V: rnd(23), Rg: null };
        var a = WheatstoneLab.analyse(s), d = WheatstoneLab.dividers(s);
        assert(near(a.vP, d.vP) && near(a.vQ, d.vQ),
          JSON.stringify(s) + ': engine ' + a.vP + '/' + a.vQ + ' vs divider ' + d.vP + '/' + d.vQ);
        assert(a.iG === 0, 'an ideal detector carried ' + a.iG);
      }
    });

    // The property the whole instrument rests on, and the reason nulling beats reading: at
    // balance the detector carries nothing, so its resistance cannot affect the answer.
    check('bridge — at balance the output is zero for EVERY detector resistance', function () {
      for (var i = 0; i < 100; i++) {
        var R1 = rnd(500), R2 = rnd(500), R3 = rnd(500);
        var s = { R1: R1, R2: R2, R3: R3, Rx: R2 * R3 / R1, V: rnd(23) };
        assert(WheatstoneLab.balanced(s), 'construction is not balanced');
        [null, 1000, 100, 10, 0.1].forEach(function (Rg) {
          s.Rg = Rg;
          var a = WheatstoneLab.analyse(s);
          assert(Math.abs(a.vPQ) <= 1e-9 * s.V, 'Rg=' + Rg + ' gave v_PQ=' + a.vPQ);
          assert(Math.abs(a.iG) <= 1e-12, 'Rg=' + Rg + ' gave i_G=' + a.iG);
        });
      }
    });

    // …and the counterpart, which is chapter 7's trap: OFF balance a real detector really does
    // pull the readings away from what the divider formulas predict.
    check('bridge — off balance, a real detector loads the dividers', function () {
      var s = { R1: 100, R2: 200, R3: 300, Rx: 400, V: 10, Rg: null };
      var open = WheatstoneLab.analyse(s), d = WheatstoneLab.dividers(s);
      assert(near(open.vPQ, d.vP - d.vQ), 'the ideal case already disagrees');
      s.Rg = 10;
      var loaded = WheatstoneLab.analyse(s);
      assert(Math.abs(loaded.vPQ - open.vPQ) > 1e-3, 'loading changed nothing');
      assert(Math.abs(loaded.vPQ) < Math.abs(open.vPQ), 'loading should shrink the output');
      assert(Math.abs(loaded.iG) > 0, 'a real detector carried no current');
      assert(Solve.powerCheck(loaded.branches).ok, 'power does not balance on the loaded bridge');
    });

    check('bridge — the output scales with the supply, the verdict does not', function () {
      var s = { R1: 100, R2: 200, R3: 300, Rx: 400, V: 10, Rg: null };
      var a = WheatstoneLab.analyse(s);
      s.V = 20;
      assert(near(WheatstoneLab.analyse(s).vPQ, 2 * a.vPQ), 'the output did not scale');
      assert(WheatstoneLab.balanced({ R1: 1, R2: 2, R3: 3, Rx: 6, V: 1 }) &&
        WheatstoneLab.balanced({ R1: 1, R2: 2, R3: 3, Rx: 6, V: 99 }), 'the verdict moved with V');
    });

    // ==================== Wheatstone: the page ====================

    var wb = WheatstoneLab({ prefix: 'wb-' });

    check('bridge — the figure draws four arms and one needle', function () {
      var arms = $('wb-figure').querySelectorAll('polyline').length;
      var needles = $('wb-figure').querySelectorAll('.needle').length;
      assert(arms === 4, 'arms: ' + arms);
      assert(needles === 1, 'needles: ' + needles);
    });

    check('bridge — five dials and six readings', function () {
      var d = $('wb-dials').querySelectorAll('input').length;
      var r = $('wb-results').querySelectorAll('.result').length;
      assert(d === 10 && r === 6, 'inputs=' + d + ' readings=' + r);
    });

    check('bridge — every chapter renders on the balanced default', function () {
      walkChapters(wb, 'wb-', 'balanced');
    });

    check('bridge — every chapter renders off balance with a real detector', function () {
      wb.set({ Rx: 470, R3: 220 });
      var btns = $('wb-detectors').querySelectorAll('[data-detector]');
      btns[2].click();
      walkChapters(wb, 'wb-', 'loaded');
      assert(wb.state().S.Rg === 10, 'the detector button did not take');
      btns[0].click();
      assert(wb.state().S.Rg === null, 'ideal did not take');
    });

    check('bridge — the verdict badge tracks the products', function () {
      wb.set({ R1: 100, R2: 200, R3: 150, Rx: 300 });
      assert($('wb-verdict').className.indexOf('badge--ok') >= 0, 'balanced: ' + $('wb-verdict').className);
      wb.set({ Rx: 301 });
      assert($('wb-verdict').className.indexOf('badge--off') >= 0, 'unbalanced: ' + $('wb-verdict').className);
    });

    // The needle is the page. A null the student cannot SEE is not a null.
    check('bridge — the needle centres at balance and swings off it', function () {
      function tipX() { return +$('wb-figure').querySelector('.needle').getAttribute('x2'); }
      wb.set({ R1: 100, R2: 200, R3: 150, Rx: 300 });
      assert(near(tipX(), 420, 1e-6), 'balanced needle at x=' + tipX() + ', expected 420');
      wb.set({ Rx: 560 });
      assert(Math.abs(tipX() - 420) > 1, 'the needle did not move off balance');
    });

    // Measure mode is only an exercise if the null is actually reachable: R3 moves in steps of
    // 5, so the unknown must be generated from a target ON that grid.
    check('bridge — measure mode hides the unknown and nulls exactly', function () {
      wb.setMode('measure');
      var s = wb.state().S;
      assert(wb.state().mode === 'measure', 'mode did not change');
      assert(!$('wb-unknown').hidden, 'the measure strip stayed hidden');
      assert(text('wb-figure').indexOf('?') >= 0, 'the unknown arm is still shown');
      assert(!WheatstoneLab.balanced(s), 'the exercise started already balanced');
      var need = s.R1 * s.Rx / s.R2;
      assert(Math.abs(need / 5 - Math.round(need / 5)) < 1e-9, 'the null sits off the grid at R3=' + need);
      wb.set({ R3: need });
      assert(WheatstoneLab.balanced(wb.state().S), 'nulling at R3=' + need + ' did not balance it');
      assert($('wb-verdict').className.indexOf('badge--ok') >= 0, 'the badge did not agree');
      assert(text('wb-unknown-out').indexOf('Nulled') >= 0, 'no result was offered');
    });

    check('bridge — reveal matches what the null predicted', function () {
      var s = wb.state().S, predicted = s.R2 * s.R3 / s.R1;
      wb.reveal();
      assert(near(predicted, wb.state().S.Rx), 'predicted ' + predicted + ', actual ' + wb.state().S.Rx);
      assert(text('wb-figure').indexOf('?') < 0, 'the arm is still hidden');
    });

    check('bridge — 20 fresh unknowns are solvable and none start balanced', function () {
      for (var i = 0; i < 20; i++) {
        wb.newUnknown();
        var s = wb.state().S, need = s.R1 * s.Rx / s.R2;
        assert(!WheatstoneLab.balanced(s), 'unknown ' + i + ' started balanced');
        assert(Math.abs(need / 5 - Math.round(need / 5)) < 1e-9, 'unknown ' + i + ' nulls at R3=' + need);
        assert(s.Rx > 0 && isFinite(s.Rx), 'unknown ' + i + ' is ' + s.Rx);
      }
    });

    check('bridge — back in explore mode everything is visible again', function () {
      wb.setMode('explore');
      assert($('wb-unknown').hidden, 'the measure strip stayed up');
      assert(text('wb-figure').indexOf('?') < 0, 'an arm is still hidden');
      walkChapters(wb, 'wb-', 'explore');
    });

    // ==================== Philosophy: the count that decides the method ====================

    // Each specimen exists to make ONE point (node wins / mesh wins / a tie). If an edit to a
    // coordinate quietly changes its count, the guide is teaching a different lesson than the
    // circuit shows — so the intended counts are pinned here.
    check('philosophy — every specimen still makes the point it was chosen for', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var t = PhilosophyLab.tally(Circuit.build(s.coords, s.edges, { flavour: false }));
        assert(t.nodeEq === s.want.nodeEq && t.meshEq === s.want.meshEq,
          s.id + ': node ' + t.nodeEq + '/mesh ' + t.meshEq +
          ', wanted node ' + s.want.nodeEq + '/mesh ' + s.want.meshEq);
      });
    });

    // The reduction to essential nodes/branches counts meshes as b − n + 1; Solve.faces gets
    // there by extracting the planar faces. Two independent routes to the same number.
    check('philosophy — the mesh count agrees with Euler', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var c = Circuit.build(s.coords, s.edges, { flavour: false });
        var t = PhilosophyLab.tally(c), euler = Solve.faces(c).faceList.length - 1;
        assert(t.meshes === euler, s.id + ': reduction says ' + t.meshes + ', faces say ' + euler);
      });
    });

    check('philosophy — every specimen is a real, solvable circuit', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var c = Circuit.build(s.coords, s.edges, { flavour: false });
        assert(Circuit.isConnected(c), s.id + ' is not connected');
        var br = Solve.branches(c, Solve.nodeVoltages(c));
        assert(Solve.powerCheck(br).ok, s.id + ': power does not balance');
        Solve.meshCurrents(c);
      });
    });

    // Nilsson's definition, and the whole reason a source in series with a resistor does NOT
    // hand the node method a free node: nothing with only two branches on it survives.
    check('philosophy — no reduced node keeps fewer than three branches', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var r = PhilosophyLab.essentials(Circuit.build(s.coords, s.edges, { flavour: false }));
        if (r.nodes.length <= 2) return;             // fully collapsed; nothing left to reduce
        r.nodes.forEach(function (g) {
          var deg = r.branches.filter(function (b) { return b.a === g || b.b === g; }).length;
          assert(deg >= 3, s.id + ': node ' + g + ' kept with degree ' + deg);
        });
      });
    });

    check('philosophy — the gallery covers node-wins, mesh-wins and a tie', function () {
      var picks = PhilosophyLab.SPECS.map(function (s) {
        return PhilosophyLab.tally(Circuit.build(s.coords, s.edges, { flavour: false })).pick;
      });
      ['node', 'mesh', 'tie'].forEach(function (k) {
        assert(picks.indexOf(k) >= 0, 'no specimen where the verdict is ' + k);
      });
    });

    var ph = PhilosophyLab({ prefix: 'ph-' });

    check('philosophy — the lab mounts, renders, and offers every specimen', function () {
      assert($('ph-figure').childNodes.length, 'nothing rendered');
      var btns = $('ph-specimens').querySelectorAll('[data-spec]');
      assert(btns.length === PhilosophyLab.SPECS.length, 'found ' + btns.length + ' buttons');
    });

    check('philosophy — every chapter renders on every specimen', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        ph.show(s.id);
        assert($('ph-figure').childNodes.length, s.id + ' drew nothing');
        walkChapters(ph, 'ph-', s.id);
        var tallies = text('ph-node-tally') + text('ph-mesh-tally');
        assert(!/undefined|NaN/.test(tallies), s.id + ' tally: ' + tallies);
      });
    });

    check('philosophy — exactly one total is flagged, and a tie flags none', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        ph.show(s.id);
        // read the markup rather than querying it: the tally rows are written as innerHTML
        var markup = $('ph-node-tally').innerHTML + $('ph-mesh-tally').innerHTML;
        var wins = markup.split('is-win').length - 1;
        var want = ph.state().tally.pick === 'tie' ? 0 : 1;
        assert(wins === want, s.id + ': ' + wins + ' totals flagged, expected ' + want);
        // and the flagged one must be the method the tally actually picked
        if (want) {
          var winner = $('ph-node-tally').innerHTML.indexOf('is-win') >= 0 ? 'node' : 'mesh';
          assert(winner === ph.state().tally.pick, s.id + ': flagged ' + winner);
        }
      });
    });

    // ============ Conventions: nothing you are allowed to pick changes the answer ============

    var cv = ConventionsLab({ prefix: 'cv-' });

    /* Which nodes and which laws each circuit offers. Kept here rather than read back off the
       lab, so the checks below assert against what the page is SUPPOSED to carry — a level
       that quietly loses a node or a mesh fails instead of being politely accommodated. */
    var CV_LEVELS = {
      basic: { nodes: ['A', 'B', 'C'], mesh: true, shared: false, kclNodes: 1, interior: 0 },
      split: { nodes: ['A', 'B', 'C'], mesh: true, shared: true, kclNodes: 1, interior: 0 },
      grid: { nodes: ['A', 'B', 'C', 'D', 'E', 'F'], mesh: false, shared: false,
              kclNodes: 4, interior: 5 },
    };

    /* The whole page rests on one claim, so it is the one asserted hardest: every LEGAL set of
       conventions leaves every physical quantity identical. Signs move, wording moves, node
       numbers move; magnitudes, differences and powers do not. */
    function invariants(st) {
      // to 9 significant figures: the KVL half reaches the shared branch by adding two mesh
      // currents and the KCL half reads it straight off the solve, so the two agree to about
      // 1e-16 and not to the bit. Anything a student could see is far coarser than this.
      function r9(x) { return Number(x.toPrecision(9)); }
      var ns = Object.keys(st.pot).sort();
      return JSON.stringify({
        mags: st.marked.map(function (m) {
          return [r9(Math.abs(m.i)), r9(Math.abs(m.v)), r9(Math.abs(m.p))];
        }),
        // a mesh current is a bookkeeping variable and flips with its loop, but its SIZE is
        // fixed by the circuit, so it belongs here alongside the branch magnitudes
        mesh: st.mesh.i.map(function (x) { return r9(Math.abs(x)); }),
        // potentials are measured from the chosen reference, so only DIFFERENCES may be
        // compared — every one of them against the same node, whichever node that is
        diffs: ns.map(function (n) { return r9(st.pot[n] - st.pot[ns[0]]); }),
      });
    }

    /* Every set of conventions a student is ALLOWED to hold, on every circuit and under both
       laws. The KVL half includes "always I₁ − I₂" with the loops agreeing, because there it
       is not a mistake — it is the right expression, arrived at by a habit that has not been
       tested yet. Likewise "one in, rest out" is legal on the first two circuits and is only
       excluded here because the grid is where it stops being. */
    function legalCombos(id) {
      var info = CV_LEVELS[id], combos = [];
      function with_(base, extra) {
        var o = {}, k;
        for (k in base) o[k] = base[k];
        for (k in extra) o[k] = extra[k];
        return o;
      }
      var loopShared = info.shared
        ? [['cw', 'signed'], ['cw', 'minus'], ['ccw', 'signed'], ['ccw', 'minus'],
           ['mixed', 'signed']]
        : [['cw', 'signed'], ['ccw', 'signed']];
      ['positive', 'electron'].forEach(function (flow) {
        info.nodes.forEach(function (ref) {
          ['flow', 'reversed'].forEach(function (polarity) {
            var base = { level: id, flow: flow, ref: ref, zero: 'chosen', polarity: polarity };
            ['leaving', 'inout'].forEach(function (kcl) {
              combos.push(with_(base, { mode: 'kcl', kcl: kcl }));
            });
            if (!info.mesh) return;
            loopShared.forEach(function (ls) {
              ['drops', 'rises'].forEach(function (kvlsign) {
                combos.push(with_(base, { mode: 'kvl', loops: ls[0],
                  shared: ls[1], kvlsign: kvlsign }));
              });
            });
          });
        });
      });
      return combos;
    }

    check('conventions — the three circuits still give the numbers the guide quotes', function () {
      // basic: 12 V across 40 + 40 — 150 mA, 12 / 6 / 0 V, 0.9 + 0.9 W
      var c = ConventionsLab.circuit('basic'), s = Solve.nodeVoltages(c), b = Solve.branches(c, s);
      assert(near(s.v[s.of.n0] - s.v[s.of.n2], 12) && near(s.v[s.of.n1] - s.v[s.of.n2], 6),
        'basic: the 12 / 6 / 0 V divider moved');
      assert(near(b[1].current, 0.15) && near(b[2].current, 0.15), 'basic: not 150 mA throughout');

      // split: 40 in series with 60 ∥ 120 — 150 mA splitting 100 / 50, powers 0.9 / 0.6 / 0.3
      c = ConventionsLab.circuit('split'); s = Solve.nodeVoltages(c); b = Solve.branches(c, s);
      assert(near(s.v[s.of.n0] - s.v[s.of.n3], 12), 'split: A−C is not 12 V');
      assert(near(s.v[s.of.n1] - s.v[s.of.n3], 6), 'split: B−C is not 6 V');
      assert(near(b[1].current, 0.15) && near(b[2].current, 0.1) && near(b[3].current, 0.05),
        'split: the 150 / 100 / 50 mA split moved');
      assert(near(b[1].power, 0.9) && near(b[2].power, 0.6) && near(b[3].power, 0.3),
        'split: the 0.9 / 0.6 / 0.3 W powers moved');

      // grid: the exam paper — 5 A in, splitting 1.25 / 3.75 at A and 0.875 / 0.375 at B
      c = ConventionsLab.circuit('grid'); s = Solve.nodeVoltages(c); b = Solve.branches(c, s);
      assert(near(b[5].current, 5), 'grid: the supply is not carrying 5 A');
      assert(near(b[0].current, 1.25) && near(b[3].current, 3.75), 'grid: the split at A moved');
      assert(near(b[1].current, 0.875) && near(b[2].current, 0.375), 'grid: the split at B moved');
      assert(near(b[4].current, 4.125), 'grid: the 20 Ω is not carrying 4.125 A');
      assert(near(Solve.powerCheck(b).generated, 1875), 'grid: not 1875 W');

      ['basic', 'split', 'grid'].forEach(function (id) {
        var cc = ConventionsLab.circuit(id);
        assert(Solve.powerCheck(Solve.branches(cc, Solve.nodeVoltages(cc))).ok,
          id + ': powers do not balance');
      });
      assert(ConventionsLab.levels.join(',') === 'basic,split,grid',
        'the three circuits are ' + ConventionsLab.levels.join(','));
    });

    check('conventions — every legal set of conventions gives the same answer', function () {
      var total = 0;
      Object.keys(CV_LEVELS).forEach(function (id) {
        var combos = legalCombos(id), first = null;
        combos.forEach(function (p) {
          cv.set(p);
          var st = cv.state();
          assert(st.pick.level === id, id + ': the board did not switch circuits');
          assert(!st.faults.length, JSON.stringify(p) + ' was flagged: ' +
            (st.faults[0] || {}).kind);
          assert(Math.abs(st.residual) < 1e-9,
            JSON.stringify(p) + ' leaves KCL residual ' + st.residual);
          st.mesh.residual.forEach(function (r, mi) {
            assert(Math.abs(r) < 1e-9, JSON.stringify(p) + ' leaves mesh ' + (mi + 1) + ' at ' + r);
          });
          var inv = invariants(st);
          if (first === null) first = inv;
          assert(inv === first, JSON.stringify(p) + ' moved something:\n  ' + inv + '\n  ' + first);
        });
        total += combos.length;
      });
      assert(total === 264, 'expected 264 legal combinations, drove ' + total);
    });

    /* The marking half. The arrow and the ± pair are one decision, so turning BOTH is legal on
       every circuit and turning one branch's marks alone never is. */
    check('conventions — reversing every marking is legal, and turns every sign', function () {
      Object.keys(CV_LEVELS).forEach(function (id) {
        cv.set({ level: id, mode: 'kcl', zero: 'chosen', kcl: 'leaving', polarity: 'flow' });
        var fwd = cv.state();
        cv.set({ polarity: 'reversed' });
        var rev = cv.state();
        assert(!rev.faults.length, id + ': all-reversed was flagged');
        rev.marked.forEach(function (m, k) {
          assert(m.i * fwd.marked[k].i < 0, id + ': element ' + k + ' kept its current sign');
          assert(near(m.p, fwd.marked[k].p), id + ': element ' + k + ' changed power');
        });
        // …and no resistor may come out producing, which is what makes it legal rather than
        // merely different. Element 0 is the source, which is allowed to deliver.
        rev.marked.slice(1).forEach(function (m, k) {
          assert(m.p > -1e-9, id + ': resistor ' + (k + 1) + ' produces ' + m.p + ' W reversed');
        });
      });
    });

    check('conventions — one branch marked backwards makes that resistor produce power', function () {
      Object.keys(CV_LEVELS).forEach(function (id) {
        cv.set({ level: id, mode: 'kcl', zero: 'chosen', kcl: 'leaving', polarity: 'odd' });
        var st = cv.state();
        var psc = st.faults.filter(function (f) { return f.kind === 'psc'; });
        assert(psc.length === 1, id + ': expected exactly one PSC fault, got ' + psc.length);
        assert(st.marked.filter(function (m) { return m.p < -1e-9; }).length === 2,
          id + ': the source and exactly one resistor should read negative');
        // a marking mistake is a mistake about WRITING, so the currents must still balance
        assert(Math.abs(st.residual) < 1e-9, id + ': a bad ± pair broke KCL, which it cannot');
      });
    });

    /* "One current in, the rest out" — legal wherever it can be held, and impossible on the
       grid for a reason that is counting rather than opinion. */
    check('conventions — "one in, rest out" is silent where it can be held', function () {
      ['basic', 'split'].forEach(function (id) {
        cv.set({ level: id, mode: 'kcl', zero: 'chosen', polarity: 'flow', kcl: 'onein' });
        var st = cv.state();
        assert(!st.faults.length, id + ': flagged a phrasing that works there');
        st.incoming.forEach(function (c, k) {
          assert(c === 1, id + ': node ' + k + ' has ' + c + ' arrows in, so it was never a test');
        });
      });
    });

    check('conventions — "one in, rest out" cannot be held on the grid, by counting', function () {
      ['flow', 'reversed'].forEach(function (polarity) {
        cv.set({ level: 'grid', mode: 'kcl', zero: 'chosen', polarity: polarity, kcl: 'onein' });
        var st = cv.state();
        assert(st.faults.some(function (f) { return f.kind === 'onein'; }),
          polarity + ': not flagged');
        assert(st.incoming.some(function (c) { return c !== 1; }),
          polarity + ': every node got exactly one in, which the counting says is impossible');
        // the argument itself: more branches between the KCL nodes than there are nodes, so
        // the arrivals cannot be shared out one apiece however the arrows are drawn
        assert(st.interior === CV_LEVELS.grid.interior,
          'grid has ' + st.interior + ' interior branches, expected ' + CV_LEVELS.grid.interior);
        assert(st.interior > st.incoming.length, 'the counting argument no longer holds');
        assert(st.incoming.reduce(function (a, b) { return a + b; }, 0) >= st.interior,
          'fewer arrivals than interior branches, which cannot happen');
        // and it is a claim about PHRASING, so the physics must be untouched
        assert(Math.abs(st.residual) < 1e-9, polarity + ': a phrasing broke KCL');
      });
      // the phrasing the rest of the site uses never has this problem
      cv.set({ kcl: 'leaving' });
      assert(!cv.state().faults.length, 'Σ leaving = 0 was flagged on the grid');
    });

    /* The mesh half. A mesh current is a bookkeeping variable: reversing its loop must reverse
       it and change nothing else, and the branch it shares must come out of the two variables
       equal to what the engine solved — otherwise the equations on screen are decoration. */
    check('conventions — reversing a loop reverses only its own variable', function () {
      cv.set({ level: 'split', mode: 'kvl', loops: 'cw', shared: 'signed', polarity: 'flow' });
      var cw = cv.state().mesh.i;
      cv.set({ loops: 'ccw' });
      var ccw = cv.state().mesh.i;
      cv.set({ loops: 'mixed' });
      var mix = cv.state().mesh.i;
      assert(near(ccw[0], -cw[0]) && near(ccw[1], -cw[1]), 'anticlockwise did not negate both');
      assert(near(mix[0], cw[0]) && near(mix[1], -cw[1]), 'reversing mesh 2 moved mesh 1');
    });

    check('conventions — the shared branch adds when the loops oppose', function () {
      var want = Math.abs(cv.state().marked[2].i);
      [['cw', -1], ['ccw', -1], ['mixed', 1]].forEach(function (c) {
        cv.set({ level: 'split', mode: 'kvl', loops: c[0], shared: 'signed' });
        var st = cv.state();
        assert(st.mesh.sharedRatio === c[1],
          c[0] + ' wrote the shared branch with ratio ' + st.mesh.sharedRatio +
          ', expected ' + c[1]);
        assert(near(Math.abs(st.marked[2].i), want), c[0] + ' changed the branch current');
      });
    });

    check('conventions — "always I₁ − I₂" is flagged only where it is actually wrong', function () {
      ['cw', 'ccw'].forEach(function (loops) {
        cv.set({ level: 'split', mode: 'kvl', loops: loops, shared: 'minus' });
        assert(!cv.state().faults.length,
          loops + ': flagged a habit that gives the right expression there');
      });
      cv.set({ level: 'split', mode: 'kvl', loops: 'mixed', shared: 'minus' });
      var st = cv.state();
      assert(st.faults.some(function (f) { return f.kind === 'shared'; }), 'mixed: not flagged');
      // and the one wrong sign must not stay in one equation
      assert(Math.abs(st.mesh.residual[0]) > 1e-9 && Math.abs(st.mesh.residual[1]) > 1e-9,
        'both mesh equations should stop closing');
      assert(Math.abs(st.residual) > 1e-9, 'KCL at B should stop balancing too');
    });

    /* The grid has three shared branches and meshEq() carries one, so KVL is not offered
       there. This pins the fallback rather than the limitation: when the KVL half is
       generalised, this check is what tells you to come back and delete it. */
    check('conventions — a circuit with no meshes falls back to KCL instead of breaking', function () {
      cv.set({ level: 'split', mode: 'kvl' });
      cv.set({ level: 'grid' });
      var st = cv.state();
      assert(st.pick.mode === 'kcl', 'the grid stayed in KVL with no meshes');
      assert(!st.mesh.i.length, 'the grid reported ' + st.mesh.i.length + ' mesh currents');
      assert(!st.faults.length, 'the fallback flagged something');
    });

    check('conventions — the signs really do move, or the claim above is vacuous', function () {
      cv.set({ level: 'split', mode: 'kcl', polarity: 'flow', ref: 'C', kcl: 'leaving' });
      var a = cv.state();
      cv.set({ polarity: 'reversed', ref: 'A' });
      var b = cv.state();
      assert(a.marked[3].i * b.marked[3].i < 0, 'R₃ current did not change sign with the marking');
      assert(a.pot.A !== b.pot.A, 'node A read the same from two different references');
    });

    check('conventions — calling the reference earthed is flagged from every node', function () {
      Object.keys(CV_LEVELS).forEach(function (id) {
        CV_LEVELS[id].nodes.forEach(function (ref) {
          cv.set({ level: id, mode: 'kcl', ref: ref, zero: 'earth', polarity: 'flow',
            kcl: 'leaving' });
          var st = cv.state();
          assert(st.faults.some(function (f) { return f.kind === 'earth'; }),
            id + '/' + ref + ' not flagged');
          // …and it is a claim about the label only: the physics must be untouched
          assert(Math.abs(st.residual) < 1e-9, id + '/' + ref + ' broke KCL, which earthing cannot do');
        });
      });
    });

    /* Switching circuits must not leave a choice pointing at something the new one has not
       got — the grid's reference nodes do not exist on the other two. */
    check('conventions — a reference the new circuit has not got falls back', function () {
      cv.set({ level: 'grid', mode: 'kcl', ref: 'E', zero: 'chosen', polarity: 'flow' });
      assert(cv.state().pick.ref === 'E', 'the grid does not offer node E');
      cv.set({ level: 'split' });
      var st = cv.state();
      assert(st.pick.ref === 'C', 'the split circuit kept a reference it has not got: ' + st.pick.ref);
      assert(!st.faults.length, 'the fallback flagged something');
      assert(Math.abs(st.residual) < 1e-9, 'the fallback broke KCL');
    });

    check('conventions — reset restores exactly the conventions the rest of the site uses', function () {
      cv.set({ level: 'grid', mode: 'kcl', flow: 'electron', ref: 'D', zero: 'earth',
        polarity: 'odd', kcl: 'onein' });
      cv.reset();
      var p = cv.state().pick;
      Object.keys(ConventionsLab.defaults).forEach(function (k) {
        assert(p[k] === ConventionsLab.defaults[k], k + ' reset to ' + p[k]);
      });
      assert(!cv.state().faults.length, 'the default conventions are flagged');
      // the three defaults that are a promise about other files, not a preference
      var c = ConventionsLab.circuit('split'), s = Solve.nodeVoltages(c);
      assert(ConventionsLab.defaults.ref === 'C' && s.v[s.of.n3] === 0,
        'js/solve.js no longer references the node this page calls C');
      assert(ConventionsLab.defaults.kcl === 'leaving',
        'js/techniques/node-voltage.js writes Σ leaving = 0; this page must agree');
      assert(ConventionsLab.defaults.loops === 'cw' && ConventionsLab.defaults.kvlsign === 'drops',
        'js/techniques/mesh-current.js walks clockwise adding drops; this page must agree');
    });

    check('conventions — every chapter renders, right and wrong', function () {
      cv.reset();
      walkChapters(cv, 'cv-', 'conventions (default)');
      // a chapter carries its own circuit and law, so these have to survive being applied to
      // whichever one the chapter arrives on
      cv.set({ zero: 'earth', polarity: 'odd', kcl: 'onein' });
      walkChapters(cv, 'cv-', 'conventions (every mistake on)');
      var board = text('cv-wrote') + text('cv-invariant') + text('cv-verdict');
      assert(!/undefined|NaN/.test(board), 'readout: ' + board.slice(0, 160));
      cv.reset();
    });

    /* A chapter may switch the circuit under the student. The one thing that must never happen
       is the guide moving them off the chapter they are reading while it does. */
    check('conventions — pressing a circuit keeps the student on their chapter', function () {
      cv.lesson.go(9);
      var at = cv.lesson.index();
      cv.set({ level: 'grid' });
      assert(cv.lesson.index() === at, 'switching circuits jumped to chapter ' + (cv.lesson.index() + 1));
      assert(!/undefined|NaN/.test(text('cv-lesson-body')), 'the chapter broke on the new circuit');
      cv.reset();
    });

    $('out').textContent = out.join('\n') + '\n\n' +
      (out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length
        ? '*** FAILURES ***' : 'all ' + out.length + ' passed');
  </script>
</body>
