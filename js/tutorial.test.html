<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>tutorial pages self-check</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #14102a; color: #ece9fb; padding: 16px; }
    #stage { position: absolute; left: -10000px; top: 0; width: 1200px; }
  </style>
</head>

<body>
  <pre id="out"></pre>

  <!-- Both pages' own markup, off-screen: the labs are mounted for real and driven, rather
       than having their arithmetic re-implemented here. The ids carry a per-page prefix
       (dy- / wb-) only because two pages that each own #figure and #lesson-body cannot both
       be mounted in one document; each real page passes no prefix. Keep these in step with
       topics/delta-wye/index.html and topics/wheatstone-bridge/index.html. -->
  <div id="stage" aria-hidden="true">
    <!-- Δ-Y -->
    <button type="button" id="dy-dir-dy" aria-pressed="true">Δ → Y</button>
    <button type="button" id="dy-dir-yd" aria-pressed="false">Y → Δ</button>
    <div id="dy-presets">
      <button type="button" data-preset="equal">Equal</button>
      <button type="button" data-preset="spread">Spread</button>
      <button type="button" data-preset="random">Random</button>
    </div>
    <button type="button" id="dy-practice" aria-pressed="false">Practice mode: off</button>
    <svg id="dy-figure" viewBox="0 0 720 360"></svg>
    <span id="dy-given-label"></span><span id="dy-out-label"></span>
    <div id="dy-dials"></div>
    <div id="dy-results"></div>
    <span id="dy-lesson-count"></span>
    <h2 id="dy-lesson-title"></h2>
    <div id="dy-lesson-body"></div>
    <button type="button" id="dy-lesson-prev"></button>
    <div id="dy-lesson-dots"></div>
    <button type="button" id="dy-lesson-next"></button>

    <!-- Wheatstone -->
    <span id="wb-verdict"></span>
    <button type="button" id="wb-mode-explore" aria-pressed="true">Explore</button>
    <button type="button" id="wb-mode-measure" aria-pressed="false">Measure</button>
    <div id="wb-detectors">
      <button type="button" data-detector="ideal" aria-pressed="true">Ideal</button>
      <button type="button" data-detector="100" aria-pressed="false">100 Ω</button>
      <button type="button" data-detector="10" aria-pressed="false">10 Ω</button>
    </div>
    <svg id="wb-figure" viewBox="0 0 760 400"></svg>
    <div id="wb-dials"></div>
    <div id="wb-results"></div>
    <div id="wb-unknown" hidden><span id="wb-unknown-out"></span></div>
    <button type="button" id="wb-new-unknown"></button>
    <button type="button" id="wb-reveal"></button>
    <span id="wb-lesson-count"></span>
    <h2 id="wb-lesson-title"></h2>
    <div id="wb-lesson-body"></div>
    <button type="button" id="wb-lesson-prev"></button>
    <div id="wb-lesson-dots"></div>
    <button type="button" id="wb-lesson-next"></button>

    <!-- Philosophy -->
    <span id="ph-verdict"></span>
    <div id="ph-specimens"></div>
    <svg id="ph-figure"></svg>
    <div id="ph-node-tally"></div>
    <div id="ph-mesh-tally"></div>
    <span id="ph-lesson-count"></span>
    <h2 id="ph-lesson-title"></h2>
    <div id="ph-lesson-body"></div>
    <button type="button" id="ph-lesson-prev"></button>
    <div id="ph-lesson-dots"></div>
    <button type="button" id="ph-lesson-next"></button>

    <!-- Conventions -->
    <div class="board">
      <span id="cv-verdict"></span>
      <div class="seg" id="cv-level">
        <button type="button" data-level="basic" aria-pressed="false">One loop</button>
        <button type="button" data-level="split" aria-pressed="true">One split</button>
        <button type="button" data-level="grid" aria-pressed="false">Multiple loops</button>
      </div>
      <div class="seg" id="cv-mode">
        <button type="button" data-mode="kcl" aria-pressed="true">KCL</button>
        <button type="button" data-mode="kvl" aria-pressed="false">KVL</button>
      </div>
      <button type="button" id="cv-reset"></button>
      <div class="figure"><svg id="cv-figure" viewBox="0 0 720 360"></svg></div>
      <div id="cv-choices"></div>
      <div id="cv-wrote"></div>
      <div id="cv-invariant"></div>
    </div>
    <span id="cv-lesson-count"></span>
    <h2 id="cv-lesson-title"></h2>
    <div id="cv-lesson-body"></div>
    <button type="button" id="cv-lesson-prev"></button>
    <div id="cv-lesson-dots"></div>
    <button type="button" id="cv-lesson-next"></button>
  </div>

  <script src="deps.js" data-load="tutorial-wheatstone tutorial-delta-wye tutorial-philosophy tutorial-conventions tests-tutorial"></script>
  <script>
    window.addEventListener('load', function () {
      Tests.report();
      Tests.$('out').textContent += '\n\n' + (Tests.out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length
        ? '*** FAILURES ***' : 'all ' + Tests.out.length + ' passed');
    });
  </script>
</body>

</html>
