<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>tutorial pages self-check</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #14102a; color: #ece9fb; padding: 16px; }
    #stage { position: absolute; left: -10000px; top: 0; width: 1200px; }
  </style>
</head>

<body>
  <pre id="out"></pre>

  <!-- Both pages' own markup, off-screen: the labs are mounted for real and driven, rather
       than having their arithmetic re-implemented here. The ids carry a per-page prefix
       (dy- / wb-) only because two pages that each own #figure and #lesson-body cannot both
       be mounted in one document; each real page passes no prefix. Keep these in step with
       topics/delta-wye/index.html and topics/wheatstone-bridge/index.html. -->
  <div id="stage" aria-hidden="true">
    <!-- Δ-Y -->
    <button type="button" id="dy-dir-dy" aria-pressed="true">Δ → Y</button>
    <button type="button" id="dy-dir-yd" aria-pressed="false">Y → Δ</button>
    <div id="dy-presets">
      <button type="button" data-preset="equal">Equal</button>
      <button type="button" data-preset="spread">Spread</button>
      <button type="button" data-preset="random">Random</button>
    </div>
    <button type="button" id="dy-practice" aria-pressed="false">Practice mode: off</button>
    <svg id="dy-figure" viewBox="0 0 720 360"></svg>
    <span id="dy-given-label"></span><span id="dy-out-label"></span>
    <div id="dy-dials"></div>
    <div id="dy-results"></div>
    <span id="dy-lesson-count"></span>
    <h2 id="dy-lesson-title"></h2>
    <div id="dy-lesson-body"></div>
    <button type="button" id="dy-lesson-prev"></button>
    <div id="dy-lesson-dots"></div>
    <button type="button" id="dy-lesson-next"></button>

    <!-- Wheatstone -->
    <span id="wb-verdict"></span>
    <button type="button" id="wb-mode-explore" aria-pressed="true">Explore</button>
    <button type="button" id="wb-mode-measure" aria-pressed="false">Measure</button>
    <div id="wb-detectors">
      <button type="button" data-detector="ideal" aria-pressed="true">Ideal</button>
      <button type="button" data-detector="100" aria-pressed="false">100 Ω</button>
      <button type="button" data-detector="10" aria-pressed="false">10 Ω</button>
    </div>
    <svg id="wb-figure" viewBox="0 0 760 400"></svg>
    <div id="wb-dials"></div>
    <div id="wb-results"></div>
    <div id="wb-unknown" hidden><span id="wb-unknown-out"></span></div>
    <button type="button" id="wb-new-unknown"></button>
    <button type="button" id="wb-reveal"></button>
    <span id="wb-lesson-count"></span>
    <h2 id="wb-lesson-title"></h2>
    <div id="wb-lesson-body"></div>
    <button type="button" id="wb-lesson-prev"></button>
    <div id="wb-lesson-dots"></div>
    <button type="button" id="wb-lesson-next"></button>

    <!-- Philosophy -->
    <span id="ph-verdict"></span>
    <div id="ph-specimens"></div>
    <svg id="ph-figure"></svg>
    <div id="ph-node-tally"></div>
    <div id="ph-mesh-tally"></div>
    <span id="ph-lesson-count"></span>
    <h2 id="ph-lesson-title"></h2>
    <div id="ph-lesson-body"></div>
    <button type="button" id="ph-lesson-prev"></button>
    <div id="ph-lesson-dots"></div>
    <button type="button" id="ph-lesson-next"></button>
  </div>

  <script src="circuit.js"></script>
  <script src="solve.js"></script>
  <script src="tutorial/draw.js"></script>
  <script src="tutorial/lesson.js"></script>
  <script src="tutorial/delta-wye.js"></script>
  <script src="tutorial/wheatstone.js"></script>
  <script src="tutorial/philosophy.js"></script>
  <script>
    var out = [];
    function check(label, fn) {
      try { fn(); out.push('PASS ' + label); }
      catch (err) { out.push('FAIL ' + label + ' — ' + err.message); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function near(a, b, t) { return Math.abs(a - b) <= (t || 1e-9) * (Math.abs(a) + Math.abs(b) + 1); }
    function rnd(hi) { return 1 + Math.random() * (hi || 900); }
    function $(id) { return document.getElementById(id); }
    function text(id) { return $(id).textContent; }

    // Every chapter is re-rendered from the LIVE values on each refresh, so a chapter that
    // captured a stale number prints it here, and a missing one prints "undefined".
    function walkChapters(lab, prefix, label) {
      var dots = $(prefix + 'lesson-dots').children.length;
      assert(dots >= 8, label + ': only ' + dots + ' chapters');
      for (var i = 0; i < dots; i++) {
        lab.lesson.go(i);
        var t = text(prefix + 'lesson-title') + ' ' + text(prefix + 'lesson-body');
        assert(!/undefined|NaN|\[object/.test(t), label + ' chapter ' + (i + 1) + ': ' + t.slice(0, 160));
        assert(t.length > 100, label + ' chapter ' + (i + 1) + ' is empty');
      }
    }

    // ==================== Δ-Y: the transform as pure arithmetic ====================

    check('Δ-Y — hand-worked Δ 30/30/30 ↔ Y 10/10/10', function () {
      var y = DeltaWyeLab.toWye({ ab: 30, bc: 30, ca: 30 });
      assert(near(y.a, 10) && near(y.b, 10) && near(y.c, 10), 'Δ→Y gave ' + JSON.stringify(y));
      var d = DeltaWyeLab.toDelta({ a: 10, b: 10, c: 10 });
      assert(near(d.ab, 30) && near(d.bc, 30) && near(d.ca, 30), 'Y→Δ gave ' + JSON.stringify(d));
    });

    // A Δ-Y transform is an IDENTITY. If a round trip moves a value, the formulas are wrong
    // and every number the page shows a student is wrong with them.
    check('Δ-Y — Δ→Y→Δ returns the same network (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var d = { ab: rnd(), bc: rnd(), ca: rnd() }, back = DeltaWyeLab.toDelta(DeltaWyeLab.toWye(d));
        assert(near(back.ab, d.ab) && near(back.bc, d.bc) && near(back.ca, d.ca),
          JSON.stringify(d) + ' → ' + JSON.stringify(back));
      }
    });

    check('Δ-Y — Y→Δ→Y returns the same network (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var y = { a: rnd(), b: rnd(), c: rnd() }, back = DeltaWyeLab.toWye(DeltaWyeLab.toDelta(y));
        assert(near(back.a, y.a) && near(back.b, y.b) && near(back.c, y.c),
          JSON.stringify(y) + ' → ' + JSON.stringify(back));
      }
    });

    // …and this is WHY it is an identity, which is what chapters 2–4 teach: the three
    // terminal-pair readings are all an outside observer can ever measure.
    check('Δ-Y — all three terminal-pair readings agree (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var d = { ab: rnd(), bc: rnd(), ca: rnd() };
        var rd = DeltaWyeLab.readsD(d), ry = DeltaWyeLab.readsY(DeltaWyeLab.toWye(d));
        assert(near(rd.AB, ry.AB) && near(rd.BC, ry.BC) && near(rd.CA, ry.CA),
          JSON.stringify(rd) + ' vs ' + JSON.stringify(ry));
      }
    });

    // ==================== Δ-Y: the page ====================

    var dy = DeltaWyeLab({ prefix: 'dy-' });

    check('Δ-Y — the figure draws both networks, six resistors', function () {
      var n = $('dy-figure').querySelectorAll('polyline').length;
      assert(n === 6, 'drew ' + n + ' resistors');
    });

    check('Δ-Y — three dials and three results', function () {
      var d = $('dy-dials').querySelectorAll('input').length;
      var r = $('dy-results').querySelectorAll('.result').length;
      assert(d === 6 && r === 3, 'inputs=' + d + ' results=' + r);
    });

    check('Δ-Y — every Δ→Y chapter renders', function () { walkChapters(dy, 'dy-', 'Δ→Y'); });

    check('Δ-Y — moving a dial keeps the student on their chapter', function () {
      dy.lesson.go(5);
      dy.set([220, 47, 15]);
      assert(dy.lesson.index() === 5, 'the refresh jumped to chapter ' + (dy.lesson.index() + 1));
      assert(!/undefined|NaN/.test(text('dy-lesson-body')), 'chapter broke');
    });

    // The page-level version of the identity above: flipping the direction hands the computed
    // values back as givens, so Δ→Y→Δ must land on the numbers the student started with.
    check('Δ-Y — flipping the direction twice restores the Δ', function () {
      dy.setDir('dy');
      dy.set([30, 20, 10]);
      var b = dy.state().delta, was = { ab: b.ab, bc: b.bc, ca: b.ca };
      dy.setDir('yd');
      dy.setDir('dy');
      var now = dy.state().delta;
      assert(near(now.ab, was.ab) && near(now.bc, was.bc) && near(now.ca, was.ca),
        JSON.stringify(was) + ' → ' + JSON.stringify(now));
    });

    check('Δ-Y — every Y→Δ chapter renders', function () {
      dy.setDir('yd');
      walkChapters(dy, 'dy-', 'Y→Δ');
      assert($('dy-figure').querySelectorAll('polyline').length === 6, 'the figure lost a resistor');
      assert(!/undefined|NaN/.test(text('dy-results')), 'results: ' + text('dy-results'));
      dy.setDir('dy');
    });

    check('Δ-Y — practice mode hides every answer, and a peek returns one', function () {
      dy.set([30, 20, 10]);
      $('dy-practice').click();
      var chips = $('dy-results').querySelectorAll('.peek');
      assert(chips.length === 3, 'expected 3 hidden results, got ' + chips.length);
      assert(text('dy-figure').indexOf('?') >= 0, 'the figure still shows the answers');
      chips[0].click();
      assert($('dy-results').querySelectorAll('.peek').length === 2, 'revealing one did not stick');
      $('dy-practice').click();
      assert($('dy-results').querySelectorAll('.peek').length === 0, 'an answer stayed hidden');
    });

    check('Δ-Y — every preset gives a usable network', function () {
      var btns = $('dy-presets').querySelectorAll('[data-preset]');
      assert(btns.length === 3, 'found ' + btns.length + ' presets');
      for (var i = 0; i < btns.length; i++) {
        btns[i].click();
        var y = dy.state().wye;
        assert(Object.keys(y).every(function (k) { return isFinite(y[k]) && y[k] > 0; }),
          btns[i].getAttribute('data-preset') + ' → ' + JSON.stringify(y));
        assert(!/undefined|NaN/.test(text('dy-results')), 'results: ' + text('dy-results'));
      }
    });

    // ==================== Wheatstone: the engine against the derivation ====================

    check('bridge — hand-worked 100/200/150/300 at 10 V balances at 6 V', function () {
      var s = { R1: 100, R2: 200, R3: 150, Rx: 300, V: 10, Rg: null };
      var p = WheatstoneLab.products(s);
      assert(p.left === 30000 && p.right === 30000, 'products ' + JSON.stringify(p));
      assert(WheatstoneLab.balanced(s), 'not reported balanced');
      var a = WheatstoneLab.analyse(s);
      assert(near(a.vP, 6) && near(a.vQ, 6) && near(a.vPQ, 0), JSON.stringify(a));
    });

    // The guide DERIVES the two dividers, then shows the engine's answer beside them. With an
    // ideal detector the two must agree exactly, or the guide is teaching something the page
    // then contradicts.
    check('bridge — an ideal detector reproduces the two dividers (200 random)', function () {
      for (var i = 0; i < 200; i++) {
        var s = { R1: rnd(600), R2: rnd(600), R3: rnd(600), Rx: rnd(600), V: rnd(23), Rg: null };
        var a = WheatstoneLab.analyse(s), d = WheatstoneLab.dividers(s);
        assert(near(a.vP, d.vP) && near(a.vQ, d.vQ),
          JSON.stringify(s) + ': engine ' + a.vP + '/' + a.vQ + ' vs divider ' + d.vP + '/' + d.vQ);
        assert(a.iG === 0, 'an ideal detector carried ' + a.iG);
      }
    });

    // The property the whole instrument rests on, and the reason nulling beats reading: at
    // balance the detector carries nothing, so its resistance cannot affect the answer.
    check('bridge — at balance the output is zero for EVERY detector resistance', function () {
      for (var i = 0; i < 100; i++) {
        var R1 = rnd(500), R2 = rnd(500), R3 = rnd(500);
        var s = { R1: R1, R2: R2, R3: R3, Rx: R2 * R3 / R1, V: rnd(23) };
        assert(WheatstoneLab.balanced(s), 'construction is not balanced');
        [null, 1000, 100, 10, 0.1].forEach(function (Rg) {
          s.Rg = Rg;
          var a = WheatstoneLab.analyse(s);
          assert(Math.abs(a.vPQ) <= 1e-9 * s.V, 'Rg=' + Rg + ' gave v_PQ=' + a.vPQ);
          assert(Math.abs(a.iG) <= 1e-12, 'Rg=' + Rg + ' gave i_G=' + a.iG);
        });
      }
    });

    // …and the counterpart, which is chapter 7's trap: OFF balance a real detector really does
    // pull the readings away from what the divider formulas predict.
    check('bridge — off balance, a real detector loads the dividers', function () {
      var s = { R1: 100, R2: 200, R3: 300, Rx: 400, V: 10, Rg: null };
      var open = WheatstoneLab.analyse(s), d = WheatstoneLab.dividers(s);
      assert(near(open.vPQ, d.vP - d.vQ), 'the ideal case already disagrees');
      s.Rg = 10;
      var loaded = WheatstoneLab.analyse(s);
      assert(Math.abs(loaded.vPQ - open.vPQ) > 1e-3, 'loading changed nothing');
      assert(Math.abs(loaded.vPQ) < Math.abs(open.vPQ), 'loading should shrink the output');
      assert(Math.abs(loaded.iG) > 0, 'a real detector carried no current');
      assert(Solve.powerCheck(loaded.branches).ok, 'power does not balance on the loaded bridge');
    });

    check('bridge — the output scales with the supply, the verdict does not', function () {
      var s = { R1: 100, R2: 200, R3: 300, Rx: 400, V: 10, Rg: null };
      var a = WheatstoneLab.analyse(s);
      s.V = 20;
      assert(near(WheatstoneLab.analyse(s).vPQ, 2 * a.vPQ), 'the output did not scale');
      assert(WheatstoneLab.balanced({ R1: 1, R2: 2, R3: 3, Rx: 6, V: 1 }) &&
        WheatstoneLab.balanced({ R1: 1, R2: 2, R3: 3, Rx: 6, V: 99 }), 'the verdict moved with V');
    });

    // ==================== Wheatstone: the page ====================

    var wb = WheatstoneLab({ prefix: 'wb-' });

    check('bridge — the figure draws four arms and one needle', function () {
      var arms = $('wb-figure').querySelectorAll('polyline').length;
      var needles = $('wb-figure').querySelectorAll('.needle').length;
      assert(arms === 4, 'arms: ' + arms);
      assert(needles === 1, 'needles: ' + needles);
    });

    check('bridge — five dials and six readings', function () {
      var d = $('wb-dials').querySelectorAll('input').length;
      var r = $('wb-results').querySelectorAll('.result').length;
      assert(d === 10 && r === 6, 'inputs=' + d + ' readings=' + r);
    });

    check('bridge — every chapter renders on the balanced default', function () {
      walkChapters(wb, 'wb-', 'balanced');
    });

    check('bridge — every chapter renders off balance with a real detector', function () {
      wb.set({ Rx: 470, R3: 220 });
      var btns = $('wb-detectors').querySelectorAll('[data-detector]');
      btns[2].click();
      walkChapters(wb, 'wb-', 'loaded');
      assert(wb.state().S.Rg === 10, 'the detector button did not take');
      btns[0].click();
      assert(wb.state().S.Rg === null, 'ideal did not take');
    });

    check('bridge — the verdict badge tracks the products', function () {
      wb.set({ R1: 100, R2: 200, R3: 150, Rx: 300 });
      assert($('wb-verdict').className.indexOf('badge--ok') >= 0, 'balanced: ' + $('wb-verdict').className);
      wb.set({ Rx: 301 });
      assert($('wb-verdict').className.indexOf('badge--off') >= 0, 'unbalanced: ' + $('wb-verdict').className);
    });

    // The needle is the page. A null the student cannot SEE is not a null.
    check('bridge — the needle centres at balance and swings off it', function () {
      function tipX() { return +$('wb-figure').querySelector('.needle').getAttribute('x2'); }
      wb.set({ R1: 100, R2: 200, R3: 150, Rx: 300 });
      assert(near(tipX(), 420, 1e-6), 'balanced needle at x=' + tipX() + ', expected 420');
      wb.set({ Rx: 560 });
      assert(Math.abs(tipX() - 420) > 1, 'the needle did not move off balance');
    });

    // Measure mode is only an exercise if the null is actually reachable: R3 moves in steps of
    // 5, so the unknown must be generated from a target ON that grid.
    check('bridge — measure mode hides the unknown and nulls exactly', function () {
      wb.setMode('measure');
      var s = wb.state().S;
      assert(wb.state().mode === 'measure', 'mode did not change');
      assert(!$('wb-unknown').hidden, 'the measure strip stayed hidden');
      assert(text('wb-figure').indexOf('?') >= 0, 'the unknown arm is still shown');
      assert(!WheatstoneLab.balanced(s), 'the exercise started already balanced');
      var need = s.R1 * s.Rx / s.R2;
      assert(Math.abs(need / 5 - Math.round(need / 5)) < 1e-9, 'the null sits off the grid at R3=' + need);
      wb.set({ R3: need });
      assert(WheatstoneLab.balanced(wb.state().S), 'nulling at R3=' + need + ' did not balance it');
      assert($('wb-verdict').className.indexOf('badge--ok') >= 0, 'the badge did not agree');
      assert(text('wb-unknown-out').indexOf('Nulled') >= 0, 'no result was offered');
    });

    check('bridge — reveal matches what the null predicted', function () {
      var s = wb.state().S, predicted = s.R2 * s.R3 / s.R1;
      wb.reveal();
      assert(near(predicted, wb.state().S.Rx), 'predicted ' + predicted + ', actual ' + wb.state().S.Rx);
      assert(text('wb-figure').indexOf('?') < 0, 'the arm is still hidden');
    });

    check('bridge — 20 fresh unknowns are solvable and none start balanced', function () {
      for (var i = 0; i < 20; i++) {
        wb.newUnknown();
        var s = wb.state().S, need = s.R1 * s.Rx / s.R2;
        assert(!WheatstoneLab.balanced(s), 'unknown ' + i + ' started balanced');
        assert(Math.abs(need / 5 - Math.round(need / 5)) < 1e-9, 'unknown ' + i + ' nulls at R3=' + need);
        assert(s.Rx > 0 && isFinite(s.Rx), 'unknown ' + i + ' is ' + s.Rx);
      }
    });

    check('bridge — back in explore mode everything is visible again', function () {
      wb.setMode('explore');
      assert($('wb-unknown').hidden, 'the measure strip stayed up');
      assert(text('wb-figure').indexOf('?') < 0, 'an arm is still hidden');
      walkChapters(wb, 'wb-', 'explore');
    });

    // ==================== Philosophy: the count that decides the method ====================

    // Each specimen exists to make ONE point (node wins / mesh wins / a tie). If an edit to a
    // coordinate quietly changes its count, the guide is teaching a different lesson than the
    // circuit shows — so the intended counts are pinned here.
    check('philosophy — every specimen still makes the point it was chosen for', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var t = PhilosophyLab.tally(Circuit.build(s.coords, s.edges, { flavour: false }));
        assert(t.nodeEq === s.want.nodeEq && t.meshEq === s.want.meshEq,
          s.id + ': node ' + t.nodeEq + '/mesh ' + t.meshEq +
          ', wanted node ' + s.want.nodeEq + '/mesh ' + s.want.meshEq);
      });
    });

    // The reduction to essential nodes/branches counts meshes as b − n + 1; Solve.faces gets
    // there by extracting the planar faces. Two independent routes to the same number.
    check('philosophy — the mesh count agrees with Euler', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var c = Circuit.build(s.coords, s.edges, { flavour: false });
        var t = PhilosophyLab.tally(c), euler = Solve.faces(c).faceList.length - 1;
        assert(t.meshes === euler, s.id + ': reduction says ' + t.meshes + ', faces say ' + euler);
      });
    });

    check('philosophy — every specimen is a real, solvable circuit', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var c = Circuit.build(s.coords, s.edges, { flavour: false });
        assert(Circuit.isConnected(c), s.id + ' is not connected');
        var br = Solve.branches(c, Solve.nodeVoltages(c));
        assert(Solve.powerCheck(br).ok, s.id + ': power does not balance');
        Solve.meshCurrents(c);
      });
    });

    // Nilsson's definition, and the whole reason a source in series with a resistor does NOT
    // hand the node method a free node: nothing with only two branches on it survives.
    check('philosophy — no reduced node keeps fewer than three branches', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        var r = PhilosophyLab.essentials(Circuit.build(s.coords, s.edges, { flavour: false }));
        if (r.nodes.length <= 2) return;             // fully collapsed; nothing left to reduce
        r.nodes.forEach(function (g) {
          var deg = r.branches.filter(function (b) { return b.a === g || b.b === g; }).length;
          assert(deg >= 3, s.id + ': node ' + g + ' kept with degree ' + deg);
        });
      });
    });

    check('philosophy — the gallery covers node-wins, mesh-wins and a tie', function () {
      var picks = PhilosophyLab.SPECS.map(function (s) {
        return PhilosophyLab.tally(Circuit.build(s.coords, s.edges, { flavour: false })).pick;
      });
      ['node', 'mesh', 'tie'].forEach(function (k) {
        assert(picks.indexOf(k) >= 0, 'no specimen where the verdict is ' + k);
      });
    });

    var ph = PhilosophyLab({ prefix: 'ph-' });

    check('philosophy — the lab mounts, renders, and offers every specimen', function () {
      assert($('ph-figure').childNodes.length, 'nothing rendered');
      var btns = $('ph-specimens').querySelectorAll('[data-spec]');
      assert(btns.length === PhilosophyLab.SPECS.length, 'found ' + btns.length + ' buttons');
    });

    check('philosophy — every chapter renders on every specimen', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        ph.show(s.id);
        assert($('ph-figure').childNodes.length, s.id + ' drew nothing');
        walkChapters(ph, 'ph-', s.id);
        var tallies = text('ph-node-tally') + text('ph-mesh-tally');
        assert(!/undefined|NaN/.test(tallies), s.id + ' tally: ' + tallies);
      });
    });

    check('philosophy — exactly one total is flagged, and a tie flags none', function () {
      PhilosophyLab.SPECS.forEach(function (s) {
        ph.show(s.id);
        // read the markup rather than querying it: the tally rows are written as innerHTML
        var markup = $('ph-node-tally').innerHTML + $('ph-mesh-tally').innerHTML;
        var wins = markup.split('is-win').length - 1;
        var want = ph.state().tally.pick === 'tie' ? 0 : 1;
        assert(wins === want, s.id + ': ' + wins + ' totals flagged, expected ' + want);
        // and the flagged one must be the method the tally actually picked
        if (want) {
          var winner = $('ph-node-tally').innerHTML.indexOf('is-win') >= 0 ? 'node' : 'mesh';
          assert(winner === ph.state().tally.pick, s.id + ': flagged ' + winner);
        }
      });
    });

    $('out').textContent = out.join('\n') + '\n\n' +
      (out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length
        ? '*** FAILURES ***' : 'all ' + out.length + ' passed');
  </script>
</body>

</html>
